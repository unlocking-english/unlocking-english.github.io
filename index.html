<style>
/* Layout: one column, hero → how it works → book shelf; each book opens its own view (#book) */
:root{--besh:#F9F6F0;--paper:#FFFFFF;--sand:#EFE6DC;--hazelnut:#CFB59E;--coffee:#6F4E37;--espresso:#4A3426;--ink:#3B2A1F;--muted:#7A6555;--line:#E6DCD0;--mist:#E4EEF5;--denim:#3E6A8A;--correct:#3F6643;
--f-display:"Playfair Display",Georgia,serif;--f-sans:"Montserrat",system-ui,-apple-system,sans-serif;--f-script:"Marck Script",cursive}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--besh);color:var(--ink);font:16px/1.6 var(--f-sans)}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(249,246,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.bar img{height:38px;width:auto;cursor:pointer}
.bar .sp{flex:1}
.search{font:inherit;font-size:15px;width:min(320px,100%);padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.search:focus{outline:none;border-color:var(--coffee)}
/* hero */
.hero{padding-block:56px 36px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.hero .logo{width:100%;max-width:440px;height:auto}
.hero h1{font:600 clamp(30px,4.6vw,48px)/1.12 var(--f-display);color:var(--espresso);margin:0 0 14px;text-wrap:balance}
.hero h1 em{color:var(--coffee)}
.hero p{margin:0 0 10px;color:var(--muted);max-width:52ch}
.hero .script{font:28px/1.2 var(--f-script);color:var(--coffee);margin-top:10px}
.keyline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
/* how it works */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:44px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.step b{display:block;font:700 20px/1.3 var(--f-display);color:var(--espresso);margin:6px 0 4px}
.step .n{font:600 13px var(--f-sans);letter-spacing:.14em;color:var(--denim)}
.step p{margin:0;font-size:14px;color:var(--muted)}
.step .ru{display:block;margin-top:4px;font-size:13px}
h2.sec{font:700 30px/1.2 var(--f-display);color:var(--espresso);margin:0 0 6px}
.secsub{color:var(--muted);margin:0 0 18px}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:56px}
.book{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;padding:0}
.book:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(111,78,55,.14)}
.book:focus-visible{outline:3px solid var(--denim);outline-offset:2px}
.spine{height:96px;position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff}
.spine::after{content:"";position:absolute;right:18px;top:16px;width:46px;height:46px;border:2px solid rgba(255,255,255,.55);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35) 0 6px,transparent 7px)}
.spine b{font:700 26px/1 var(--f-display);position:relative;z-index:1}
.binfo{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.binfo .sub{font-size:13px;color:var(--muted)}
.lvls{display:flex;flex-wrap:wrap;gap:6px}
.lv{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--besh);border:1px solid var(--line)}
.soon{font-size:12px;font-weight:600;color:var(--muted);font-style:italic}
.cnt{margin-top:auto;font-size:13px;font-weight:600;color:var(--coffee)}
/* course view */
.back{font:600 14px var(--f-sans);background:none;border:0;color:var(--coffee);cursor:pointer;padding:0;margin:28px 0 10px}
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding-bottom:14px;border-bottom:2px solid var(--hazelnut);margin-bottom:18px}
.chead h1{font:700 clamp(32px,5vw,46px)/1.05 var(--f-display);color:var(--espresso);margin:0}
.chead .sub{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{font:600 14px var(--f-sans);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
.tab.on{background:var(--espresso);border-color:var(--espresso);color:#fff}
.level{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:18px}
.level h2{font:700 26px/1.2 var(--f-display);color:var(--coffee);margin:0 0 4px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.col h3{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:12px 0 8px;display:flex;gap:8px;align-items:center}
.col h3::after{content:"";flex:1;height:1px;background:var(--line)}
.t-lessons{color:var(--coffee)}.t-homework{color:var(--denim)}.t-other{color:var(--muted)}
.unit{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--besh);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 14px}
.item a{flex:1;min-width:0;text-decoration:none;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item a:hover{color:var(--coffee);text-decoration:underline}
.item .crs{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.copy{font:600 12px var(--f-sans);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.copy:hover{border-color:var(--coffee)}.copy.ok{background:var(--correct);border-color:var(--correct);color:#fff}
.empty{background:var(--paper);border:1px dashed var(--hazelnut);border-radius:18px;padding:22px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:22px;padding-block:32px 24px}.hero .logo{max-width:300px}.shelf{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
@media (max-width:620px){.how{grid-template-columns:1fr}.shelf{grid-template-columns:1fr}.bar img{height:32px}.search{width:100%}.bar .sp{display:none}}
@media (prefers-reduced-motion:reduce){.book{transition:none}html{scroll-behavior:auto}}
</style>
</head>

<script>
/* ===== Settings: the books on the shelf (folder name on GitHub → how it looks) =====
   Add a new book: create a folder with that name on GitHub and add a line here (or it appears automatically). */
var REPO = "unlocking-english/unlocking-english.github.io";
var BOOKS = [
  { dir: "Speakout", name: "Speakout", sub: "3rd edition · Adults", color: "#3E6A8A" },
  { dir: "Outcomes", name: "Outcomes", sub: "Adults", color: "#A4483A" },
  { dir: "Get Involved", name: "Get Involved!", sub: "Teens", color: "#3F6643" },
  { dir: "Metro", name: "Metro", sub: "Teens", color: "#7B4E8E" },
  { dir: "Go Getter", name: "Go Getter", sub: "Kids & teens", color: "#C77A2A" },
  { dir: "Grammar", name: "Grammar", sub: "Grammar studio · без учебника", color: "#6F4E37" },
  { dir: "Topics", name: "Topics & holidays", sub: "Темы и праздники", color: "#9A6B4F" }
];
var LEVELS = ["starter", "a1", "a1+", "a2", "a2+", "b1", "b1+", "b2", "b2+", "c1", "c2"];
var TYPES = { lessons: "lessons", lesson: "lessons", "уроки": "lessons", homework: "homework", homeworks: "homework", hw: "homework", "домашки": "homework" };
var TYPE_LABEL = { lessons: "Lessons · Уроки", homework: "Homework · Домашние задания" };

function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function pretty(name) { return name.replace(/\.html?$/i, "").replace(/_unlocking-english$/i, "").replace(/_+/g, " · ").replace(/-/g, " ").replace(/A2plus/g, "A2+").replace(/B1plus/g, "B1+").replace(/\s+/g, " ").trim(); }
function unitOf(n) {
  var m = n.match(/unit\s*[-_ ]?\s*(\d+)\s*([a-d])?(?![a-z])/i); if (m) return { k: +m[1] + (m[2] ? (m[2].toLowerCase().charCodeAt(0) - 96) / 10 : 0), label: "Unit " + m[1] + (m[2] ? m[2].toUpperCase() : "") };
  m = n.match(/review\s*[-_ ]?\s*(\d+)/i); if (m) return { k: +m[1] + .95, label: "Review " + m[1] };
  return { k: 999, label: "" };
}
function lvRank(l) { var c = String(l).toLowerCase().replace(/.*·\s*/, ""); var i = LEVELS.indexOf(c); return i < 0 ? 50 : i; }
var DATA = [], LOADED = false, FAILED = false;

function parse(paths) {
  DATA = paths.map(function (p) {
    var parts = p.split("/"), file = parts.pop();
    if (!parts.length && /^(index|404)\.html$/i.test(file)) return null;
    if (parts.some(function (x) { return /^hidden$/i.test(x) || /^[_.]/.test(x); })) return null;
    var dir = parts[0] || "Other", level = parts[1] || "", tf = (parts[2] || "").toLowerCase();
    var type = TYPES[tf] || (parts[2] ? parts[2] : (/homework|\bhw\b/i.test(file) ? "homework" : "lessons"));
    return { path: p, file: file, dir: dir, level: level, type: type, unit: unitOf(file), title: pretty(file) };
  }).filter(Boolean);
  DATA.forEach(function (d) { if (!BOOKS.some(function (b) { return b.dir === d.dir; })) BOOKS.push({ dir: d.dir, name: d.dir === "Other" ? "Other · Другое" : d.dir, sub: "", color: "#7A6555" }); });
}
function href(d) { return d.path.split("/").map(encodeURIComponent).join("/"); }
function copyBtn(url) {
  var b = el("button", "copy", "Copy link"); b.type = "button";
  b.addEventListener("click", function () {
    var done = function () { b.textContent = "✓ Copied"; b.classList.add("ok"); setTimeout(function () { b.textContent = "Copy link"; b.classList.remove("ok"); }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Copy:", url); }); else window.prompt("Copy:", url);
  });
  return b;
}
function item(d, showCourse) {
  var row = el("div", "item"), a = el("a", null, d.title); a.href = href(d);
  if (showCourse) a.append(el("span", "crs", d.dir + (d.level ? " · " + d.level : "") + " · " + (TYPE_LABEL[d.type] || d.type)));
  row.append(a, copyBtn(location.origin + "/" + href(d))); return row;
}
function listByUnit(items, showCourse) {
  var list = el("div", "list"), last = null;
  items.sort(function (a, b) { return a.unit.k - b.unit.k || a.title.localeCompare(b.title); }).forEach(function (d) {
    if (d.unit.label !== last) { last = d.unit.label; if (last) list.append(el("div", "unit", last)); }
    list.append(item(d, showCourse));
  });
  return list;
}

/* ===== views ===== */
function viewHome() {
  var app = document.getElementById("app"); app.innerHTML = "";
  var w = el("div", "wrap");
  var hero = el("section", "hero");
  var left = el("div"); var logo = el("img", "logo"); logo.src = document.getElementById("homeLogo").src; logo.alt = "Unlocking English with Val"; left.append(logo);
  var right = el("div");
  var h = el("h1"); h.innerHTML = "Interactive lessons &amp; <em>homework</em>"; right.append(h);
  right.append(el("p", null, "Choose your book and level, open a task and unlock every key. Everything works in the browser — on a phone, tablet or computer."));
  right.append(el("p", null, "Выберите свой учебник и уровень, откройте задание и откройте все ключи. Всё работает в браузере — на телефоне, планшете и компьютере."));
  right.append(el("div", "script", "Every lesson is a key."));
  var kl = el("div", "keyline"); ["Adults", "Teens", "A1 – B2", "Lessons", "Homework"].forEach(function (t) { kl.append(el("span", "pill", t)); }); right.append(kl);
  hero.append(left, right); w.append(hero);
  var how = el("section", "how");
  [["01", "Choose your book", "Выберите учебник и уровень."], ["02", "Open the task", "Откройте урок или домашку и впишите своё имя."], ["03", "Send your report", "В конце нажмите «📸 My report» и пришлите скриншот Вэл."]].forEach(function (s) {
    var d = el("div", "step"); d.append(el("span", "n", s[0]), el("b", null, s[1])); var p = el("p", null, ""); p.append(el("span", "ru", s[2])); d.append(p); how.append(d); });
  w.append(how);
  w.append(el("h2", "sec", "Books"), el("p", "secsub", "Учебники и материалы"));
  var shelf = el("div", "shelf");
  BOOKS.forEach(function (b) {
    var items = DATA.filter(function (d) { return d.dir === b.dir; });
    if (!items.length && b.dir === "Other") return;
    var card = el("button", "book"); card.type = "button";
    var sp = el("div", "spine"); sp.style.background = "linear-gradient(135deg," + b.color + "," + shade(b.color) + ")"; sp.append(el("b", null, b.name));
    var info = el("div", "binfo"); info.append(el("span", "sub", b.sub || " "));
    var lv = el("div", "lvls"); uniq(items.map(function (d) { return d.level; })).filter(Boolean).sort(function (a, c) { return lvRank(a) - lvRank(c); }).forEach(function (l) { lv.append(el("span", "lv", l.replace(/.*·\s*/, "") === l ? l : l)); });
    info.append(lv);
    info.append(items.length ? el("span", "cnt", items.length + (items.length === 1 ? " task →" : " tasks →")) : el("span", "soon", LOADED ? "Coming soon · Скоро" : (FAILED ? "" : "…")));
    card.append(sp, info); card.addEventListener("click", function () { location.hash = slug(b.dir); });
    shelf.append(card);
  });
  if (FAILED) w.append(el("div", "empty", "Could not load the list of tasks. Please refresh the page in a minute. · Не удалось загрузить список заданий. Обновите страницу через минуту."));
  w.append(shelf); app.append(w); window.scrollTo(0, 0);
}
function viewBook(b, onlyLevel) {
  var app = document.getElementById("app"); app.innerHTML = "";
  var w = el("div", "wrap"), back = el("button", "back", "← All books · Все учебники"); back.type = "button"; back.addEventListener("click", function () { location.hash = ""; });
  var head = el("div", "chead"); head.append(el("h1", null, b.name), el("span", "sub", b.sub || "")); w.append(back, head);
  var items = DATA.filter(function (d) { return d.dir === b.dir; });
  if (!items.length) { w.append(el("div", "empty", LOADED ? "Coming soon · Скоро здесь появятся уроки и домашние задания." : "Loading… · Загружаю…")); app.append(w); return; }
  var levels = uniq(items.map(function (d) { return d.level; })).sort(function (a, c) { return lvRank(a) - lvRank(c) || a.localeCompare(c); });
  if (levels.length > 1) {
    var tabs = el("div", "tabs");
    [["", "All levels"]].concat(levels.map(function (l) { return [l, l || "Other"]; })).forEach(function (t) {
      var bt = el("button", "tab" + ((onlyLevel || "") === t[0] ? " on" : ""), t[1]); bt.type = "button";
      bt.addEventListener("click", function () { viewBook(b, t[0]); }); tabs.append(bt); });
    w.append(tabs);
  }
  levels.filter(function (l) { return !onlyLevel || l === onlyLevel; }).forEach(function (l) {
    var box = el("section", "level"); box.append(el("h2", null, l || "All levels"));
    var li = items.filter(function (d) { return d.level === l; }), types = uniq(li.map(function (d) { return d.type; }));
    types.sort(function (a, c) { var o = { lessons: 0, homework: 1 }; return (a in o ? o[a] : 2) - (c in o ? o[c] : 2) || a.localeCompare(c); });
    var cols = el("div", "cols");
    types.forEach(function (t) { var col = el("div", "col"); col.append(el("h3", "t-" + (TYPE_LABEL[t] ? t : "other"), TYPE_LABEL[t] || t)); col.append(listByUnit(li.filter(function (d) { return d.type === t; }))); cols.append(col); });

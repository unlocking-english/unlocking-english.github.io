<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocking English with Val</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--besh:#F9F6F0;--paper:#FFFFFF;--sand:#EFE6DC;--hazelnut:#CFB59E;--coffee:#6F4E37;--espresso:#4A3426;--ink:#3B2A1F;--muted:#7A6555;--line:#E6DCD0;--mist:#E4EEF5;--denim:#3E6A8A;--correct:#3F6643;--correct-tint:#E8F0E4;
--f-display:"Playfair Display",Georgia,serif;--f-sans:"Montserrat",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--besh);color:var(--ink);font:16px/1.55 var(--f-sans)}
.wrap{max-width:860px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--denim)}
h1{font:700 clamp(30px,6vw,44px)/1.1 var(--f-display);color:var(--espresso);margin:0;text-wrap:balance}
h1 em{color:var(--coffee)}
.lead{color:var(--muted);margin:0}
.search{width:100%;font:inherit;padding:12px 16px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);margin:6px 0 18px}
.search:focus{outline:none;border-color:var(--coffee)}
h2{font:700 20px/1.3 var(--f-display);color:var(--coffee);margin:26px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(111,78,55,.06)}
.item a.t{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600}
.item a.t:hover{color:var(--coffee);text-decoration:underline}
.item small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.hw{background:var(--mist);color:var(--denim)}.tag.ls{background:var(--sand);color:var(--coffee)}
.copy{font:600 13px var(--f-sans);border:1px solid var(--line);background:var(--besh);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.copy:hover{border-color:var(--coffee)}.copy.ok{background:var(--correct);border-color:var(--correct);color:#fff}
.note{background:var(--paper);border:1px dashed var(--hazelnut);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:14px}
@media (max-width:560px){.item{flex-wrap:wrap}.item a.t{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Unlocking English with Val</span>
    <h1>Lessons &amp; <em>homework</em></h1>
    <p class="lead">Нажмите на задание, чтобы открыть его. · Tap a task to open it.</p>
  </header>
  <input class="search" id="q" type="search" placeholder="Search · Поиск: Speakout, Unit 2, Halloween…" aria-label="Search">
  <div id="out"><p class="note">Loading… · Загружаю список…</p></div>
</div>
<script>
/* Lists every .html file in the repository automatically — just upload files on GitHub. */
var REPO = "unlocking-english/unlocking-english.github.io";
var HIDE = ["index.html", "404.html"];
function pretty(f) {
  var s = f.replace(/\.html$/i, "").replace(/_unlocking-english$/i, "");
  var parts = s.split("_");
  var course = parts[0].replace(/-/g, " ").replace(/A2plus/g, "A2+").replace(/B1plus/g, "B1+");
  var rest = parts.slice(1).join(" · ").replace(/-/g, " ");
  return { course: course, title: rest || course };
}
function kind(f) { return /homework|hw\b/i.test(f) ? ["hw", "Homework"] : /listening/i.test(f) ? ["ls", "Listening"] : ["ls", "Lesson"]; }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
var FILES = [];
function render() {
  var q = document.getElementById("q").value.trim().toLowerCase(), out = document.getElementById("out"); out.innerHTML = "";
  var groups = {};
  FILES.filter(function (f) { return !q || f.toLowerCase().replace(/[-_]/g, " ").indexOf(q) > -1; }).forEach(function (f) { var p = pretty(f); (groups[p.course] = groups[p.course] || []).push([f, p]); });
  var keys = Object.keys(groups).sort();
  if (!keys.length) { out.append(el("p", "note", q ? "Nothing found. · Ничего не найдено." : "No tasks yet. · Заданий пока нет.")); return; }
  keys.forEach(function (k) {
    out.append(el("h2", null, k)); var list = el("div", "list");
    groups[k].forEach(function (x) {
      var f = x[0], p = x[1], kd = kind(f), url = location.origin + "/" + encodeURI(f);
      var row = el("div", "item"), a = el("a", "t", p.title); a.href = encodeURI(f);
      var sm = el("small", null, f); a.append(sm);
      var b = el("button", "copy", "Copy link"); b.type = "button";
      b.addEventListener("click", function () {
        var done = function () { b.textContent = "✓ Copied"; b.classList.add("ok"); setTimeout(function () { b.textContent = "Copy link"; b.classList.remove("ok"); }, 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt("Copy:", url); });
        else prompt("Copy:", url);
      });
      row.append(el("span", "tag " + kd[0], kd[1]), a, b); list.append(row);
    });
    out.append(list);
  });
}
fetch("https://api.github.com/repos/" + REPO + "/contents/")
  .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
  .then(function (items) { FILES = items.filter(function (i) { return i.type === "file" && /\.html$/i.test(i.name) && HIDE.indexOf(i.name) < 0; }).map(function (i) { return i.name; }); render(); })
  .catch(function () { document.getElementById("out").innerHTML = '<p class="note">Could not load the list. Please refresh the page in a minute. · Не удалось загрузить список. Обновите страницу через минуту.</p>'; });
document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>

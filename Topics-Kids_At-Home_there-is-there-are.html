<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission: At Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@700&family=Nunito:wght@600;700;800&family=Playfair+Display:wght@900&display=swap&subset=cyrillic" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --chalk:#FBFAF7;--paper:#FFFFFF;--cloud:#EDEDEB;
  --coral:#F4776A;--sunny:#F7B84B;--mint:#86D3B5;--bubblegum:#F7A6BC;--lilac:#A9A6EE;--lemon:#F5DE3D;
  --terrazzo:#1F4D3F;--ink:#3B2A1F;--muted:#6E6460;
  --coral-deep:#B8442F;--teal-deep:#1F6B57;--plum:#5A4FB0;
  --coral-tint:#FDE7E3;--mint-tint:#E3F5EC;--wood:#6F4E37;
  --f-poster:"Playfair Display",Georgia,serif;
  --f-round:"Comfortaa","Nunito",system-ui,sans-serif;
  --f-sans:"Nunito",system-ui,sans-serif;
  --f-crayon:"Caveat",cursive;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --gap-xs:6px;--gap-sm:12px;--gap-md:20px;--gap-lg:32px;--gap-xl:56px;
  --r-sm:14px;--r-md:22px;--r-lg:32px;--r-full:999px;
  --lift:0 6px 0 rgba(59,42,31,.10);--press:0 2px 0 rgba(59,42,31,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--chalk);color:var(--ink);font:600 17px/26px var(--f-sans);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px;position:relative}
.emo{font-family:var(--f-emoji);font-weight:400}
.ru{font:600 14px/20px var(--f-sans);color:var(--muted);margin:2px 0 0}
.task{font:700 18px/26px var(--f-sans);margin:0}
.crayon{font:700 28px/32px var(--f-crayon)}
.doodle{position:absolute;pointer-events:none;z-index:0}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(6px);border-bottom:2px dashed var(--cloud)}
.bar-in{max-width:820px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-title{font:700 15px/20px var(--f-round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-coins{display:flex;align-items:center;gap:8px;font:800 18px/24px var(--f-sans);color:var(--teal-deep)}
.mini-chest{width:46px;height:40px}

/* header */
header{position:relative;text-align:center;padding:28px 0 8px}
.logo{width:160px;height:auto;display:block;margin:0 auto 14px}
.label{display:inline-block;background:var(--mint);color:var(--ink);font:800 14px/20px var(--f-sans);padding:6px 14px;border-radius:var(--r-full)}
h1{font:900 44px/46px var(--f-poster);margin:14px 0 6px;position:relative;z-index:1}
.tagline{color:var(--coral-deep);margin:0 0 14px}
.chest-box{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);border-radius:var(--r-lg);padding:var(--gap-md) var(--gap-lg);box-shadow:var(--lift)}
.big-chest{width:150px;height:126px}
.counter{font:700 18px/26px var(--f-sans);color:var(--teal-deep)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:330px}
.slot{width:22px;height:22px;border-radius:var(--r-full);border:2px dashed #CFC9C4;display:grid;place-items:center;font-size:14px;line-height:1}
.slot.on{border:2px solid var(--sunny);background:var(--sunny)}
.slot.bonus{border-color:var(--bubblegum)}
.slot.bonus.on{background:var(--bubblegum);border-color:var(--bubblegum)}

/* chest svg */
.lid{transform-origin:16px 46px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.chest.open .lid{transform:translateY(-6px) rotate(-28deg)}
.glow{opacity:0;transition:opacity .5s}
.chest.open .glow{opacity:1}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}

/* sections */
section.part{position:relative;margin-top:var(--gap-xl)}
.part-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.num{flex:none;width:44px;height:44px;border-radius:var(--r-full);background:var(--coral);color:var(--ink);display:grid;place-items:center;font:700 20px/1 var(--f-round);box-shadow:var(--lift)}
.num.hard{background:var(--sunny);width:auto;padding:0 14px;font-size:15px}
h2{font:700 24px/30px var(--f-round);margin:0}
.part-sub{margin:0 0 var(--gap-md) 56px}
.card{position:relative;z-index:1;background:var(--paper);border-radius:var(--r-md);padding:var(--gap-md);box-shadow:var(--lift);margin-bottom:var(--gap-md)}
.card.solved{background:var(--mint-tint)}
.q{font:800 20px/28px var(--f-sans);margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q .big{font-size:30px;line-height:38px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--gap-sm);margin-top:var(--gap-sm)}
.opt,.btn,.tile,.chip,.basket{position:relative;min-height:56px;border:2px solid var(--cloud);background:var(--paper);border-radius:var(--r-sm);box-shadow:var(--lift);cursor:pointer;padding:8px 14px;font:800 18px/24px var(--f-sans);transition:transform .12s,box-shadow .12s}
.opt:active,.btn:active,.tile:active,.chip:active{transform:translateY(4px);box-shadow:var(--press)}
.opt .emo{font-size:34px;line-height:40px}
.opt.ok{background:var(--mint-tint);border-color:var(--mint);color:var(--teal-deep)}
.opt.no{background:var(--coral-tint);border-color:var(--coral);color:var(--coral-deep)}
.opt.ok::after{content:"✓";position:absolute;top:4px;right:8px;font:800 18px/1 var(--f-sans)}
.opt.no::after{content:"✗";position:absolute;top:4px;right:8px;font:800 18px/1 var(--f-sans)}
.opt[disabled]{cursor:default}
.scrib{position:absolute;inset:-9px -7px;width:calc(100% + 14px);height:calc(100% + 18px);pointer-events:none;overflow:visible}
.scrib path{fill:none;stroke:var(--lilac);stroke-width:4;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{min-height:26px;margin-top:10px;font:800 17px/26px var(--f-sans)}
.fb.ok{color:var(--teal-deep)}
.fb.no{color:var(--coral-deep)}
.say{flex:none;width:44px;height:44px;min-height:44px;padding:0;border-radius:var(--r-full);background:var(--lemon);border:none;box-shadow:var(--lift);cursor:pointer;font-size:20px}
.btn{background:var(--coral);border-color:var(--coral);color:var(--ink)}

/* collection poster */
.poster{position:relative;z-index:1;background:var(--cloud);border-radius:var(--r-lg);padding:var(--gap-lg) var(--gap-md);margin-top:var(--gap-xl);text-align:center;overflow:hidden}
.poster h2.pt{font:900 44px/46px var(--f-poster);margin:0}
.poster .pl{font:700 28px/34px var(--f-round);color:var(--plum);margin:4px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap-sm);margin-top:var(--gap-md);position:relative;z-index:1}
.etile{border:none;background:var(--paper);border-radius:var(--r-md);padding:12px 6px 10px;cursor:pointer;opacity:.45;filter:grayscale(.6);transition:opacity .3s,filter .3s,transform .3s;box-shadow:none;min-height:44px}
.etile .emo{display:block;font-size:64px;line-height:72px}
.etile .w{display:block;font:800 20px/26px var(--f-sans)}
.etile .r{display:block;font:600 14px/18px var(--f-sans);color:var(--muted)}
.etile.stuck{opacity:1;filter:none;box-shadow:var(--lift);transform:rotate(var(--tilt,0deg))}
.etile.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1) rotate(var(--tilt,0deg))}}
.code{position:relative;display:flex;align-items:center;gap:14px;margin-top:var(--gap-md);text-align:left;padding:14px 18px;border-radius:var(--r-md);background:var(--mint);z-index:1}
.code b{font:700 16px/22px var(--f-round);color:var(--ink)}
.code .ar{font:900 30px/34px var(--f-poster);background:var(--paper);border-radius:var(--r-sm);padding:6px 12px;white-space:nowrap}
.code p{margin:2px 0 0;font:600 15px/21px var(--f-sans);color:var(--terrazzo)}
.dots{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}

/* story */
.page{position:relative;z-index:1;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--lift);padding:var(--gap-md);margin-bottom:var(--gap-sm)}
.page-n{font:700 15px/20px var(--f-round);color:var(--plum)}
.scene{font-size:46px;line-height:56px;margin:6px 0 8px;letter-spacing:4px}
.lines{font:700 21px/34px var(--f-sans);margin:0}
.sent{cursor:pointer;border-radius:8px;padding:1px 3px;transition:background .2s}
.sent:hover{background:var(--cloud)}
.sent.speaking{background:var(--lemon)}
.page-tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn.small{min-height:44px;font-size:16px;background:var(--lemon);border-color:var(--lemon)}
.think{border-left:6px solid var(--lilac)}
.think .tag{font:700 24px/28px var(--f-crayon);color:var(--plum)}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:var(--gap-sm);margin:var(--gap-sm) 0}
.chip.sel{border-color:var(--plum);background:#EFEEFC}
.chip.placed{cursor:default;box-shadow:none;background:var(--mint-tint);border-color:var(--mint);font-size:16px;min-height:44px}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-sm)}
.basket{min-height:150px;display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:center;background:var(--chalk);border:3px dashed var(--cloud)}
.basket .bh{font:700 20px/26px var(--f-round)}
.basket .bh .emo{font-size:34px;display:block;line-height:40px}
.basket .chip{cursor:default}

/* order & build */
.answer{min-height:64px;border:3px dashed var(--cloud);border-radius:var(--r-sm);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:var(--gap-sm) 0}
.answer.col{flex-direction:column;align-items:stretch}
.answer .ph{color:var(--muted);font-size:15px;padding:0 6px}
.tiles{display:flex;flex-wrap:wrap;gap:var(--gap-sm)}
.tile.used{visibility:hidden}
.placed-tile{background:var(--mint-tint);border:2px solid var(--mint);border-radius:var(--r-sm);padding:8px 12px;font:800 18px/24px var(--f-sans);min-height:44px;display:flex;align-items:center;gap:8px}
.placed-tile .n{width:28px;height:28px;border-radius:var(--r-full);background:var(--coral);display:grid;place-items:center;font:700 15px/1 var(--f-round);flex:none}

/* bonus */
.bonus-zone{position:relative;background:var(--bubblegum);border-radius:var(--r-lg);padding:var(--gap-md);margin-top:var(--gap-md)}
.bonus-zone .card{margin-bottom:var(--gap-sm)}
.bonus-zone .card:last-child{margin-bottom:0}
.write{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:var(--gap-sm)}
.write input{flex:1;min-width:140px;min-height:52px;border:2px solid var(--cloud);border-radius:var(--r-sm);padding:8px 14px;font:800 22px/28px var(--f-sans);color:var(--ink);background:var(--paper)}
.write input:focus{outline:3px solid var(--lilac);outline-offset:1px}
.blanks{font:800 24px/30px var(--f-sans);letter-spacing:6px;color:var(--muted)}

/* final */
.final{position:relative;text-align:center;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--lift);padding:var(--gap-lg) var(--gap-md);margin-top:var(--gap-xl);overflow:hidden}
.final .big-chest{width:200px;height:168px}
.key-btn{margin-top:var(--gap-md);min-height:64px;padding:10px 26px;border:none;border-radius:var(--r-full);background:var(--sunny);box-shadow:var(--lift);font:800 20px/26px var(--f-sans);cursor:pointer}
.key-btn[disabled]{background:var(--cloud);cursor:default;color:var(--muted)}
.key-btn .emo{font-size:30px;vertical-align:middle}
.unlocked{display:none}
.final.done .unlocked{display:block}
.final .yay{font:700 48px/52px var(--f-crayon);color:var(--coral-deep);margin:10px 0 0}
.burst{position:absolute;left:50%;top:150px;font-size:40px;pointer-events:none;font-family:var(--f-emoji);animation:burst .6s ease-out forwards;opacity:0}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
.final-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:var(--gap-md)}
.final-grid span{background:var(--cloud);border-radius:var(--r-sm);font-size:34px;line-height:52px;font-family:var(--f-emoji)}
.flycoin{position:fixed;z-index:50;font-size:30px;pointer-events:none;font-family:var(--f-emoji)}
footer{text-align:center;margin-top:var(--gap-xl);color:var(--muted);font-size:14px}
footer img{width:140px;display:block;margin:0 auto 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:520px){
  h1,.poster h2.pt{font-size:34px;line-height:38px}
  .poster .pl{font-size:22px;line-height:28px}
  .etile .emo{font-size:46px;line-height:54px}
  .etile .w{font-size:17px}
  .scene{font-size:36px;line-height:46px}
  .lines{font-size:19px;line-height:31px}
  .part-sub{margin-left:0}
  .final-grid{grid-template-columns:repeat(4,1fr)}
  .chest-box{padding:var(--gap-md)}
  .bar-title{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .scrib path{stroke-dashoffset:0}
  .burst{display:none}
  html{scroll-behavior:auto}
}
/* ---------- At Home: missions ---------- */
.tab,.etile,.say,.key-btn,.basket,.chip,.tile,.opt,.btn,.mtab,.tok,.cnt-btn{transition:transform .15s,box-shadow .15s,border-color .15s,background-color .15s,opacity .2s}
@media (hover:hover){
  .opt:hover:not([disabled]),.tile:hover:not([disabled]),.chip:hover:not(.placed),.btn:hover:not([disabled]),.key-btn:hover:not([disabled]),.mtab:hover,.tok:hover:not([disabled]),.cnt-btn:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 8px 0 rgba(59,42,31,.12);border-color:var(--sunny)}
  .etile.stuck:hover,.say:hover{transform:translateY(-2px) rotate(var(--tilt,0deg));box-shadow:0 8px 0 rgba(59,42,31,.12)}
}
.say:active,.key-btn:active:not([disabled]),.basket:active,.mtab:active,.tok:active,.cnt-btn:active{transform:translateY(4px);box-shadow:var(--press)}
.opt.no{text-decoration:line-through;opacity:.7}
.opt.fade{opacity:.5}
.fb-in{animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.baskets.armed .basket{border-style:solid;border-color:var(--lilac)}
.chip.sel{border-color:var(--plum)}
.key-btn.ready,.next.ready{animation:keyPulse .6s ease-in-out 3}
@keyframes keyPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:60;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:var(--r-full);font:800 16px/22px var(--f-sans);box-shadow:var(--lift);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.mute{width:44px;height:44px;border-radius:var(--r-full);border:2px solid var(--cloud);background:var(--paper);cursor:pointer;font-size:20px;flex:none}

/* icons */
.ic{font-family:var(--f-emoji);font-weight:400}
.ic svg{width:1em;height:1em;display:inline-block;vertical-align:-.15em}

/* power meter */
.power{display:flex;align-items:center;gap:4px;font:800 14px/1 var(--f-sans)}
.power i{width:12px;height:18px;border-radius:4px;border:2px solid var(--sunny);display:block}
.power i.on{background:var(--sunny)}
.power.boom{animation:keyPulse .5s}
.stk-count{font:800 15px/1 var(--f-sans);color:var(--plum)}
.shelf{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;align-items:center}
.shelf .stk{font-family:var(--f-emoji);font-size:30px;line-height:38px;background:var(--cloud);border-radius:var(--r-full);width:44px;height:44px;display:grid;place-items:center}
.shelf .stk.pop{animation:pop .45s}
.shelf .ph{font:600 14px/20px var(--f-sans);color:var(--muted)}

/* mission map */
.map{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:var(--gap-lg)}
.mtab{position:relative;min-width:52px;min-height:52px;border:2px solid var(--cloud);background:var(--paper);border-radius:var(--r-sm);box-shadow:var(--lift);cursor:pointer;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 14px/16px var(--f-round)}
.mtab .ic{font-size:20px;line-height:24px}
.mtab.brk{border-color:var(--lilac);border-style:dashed}
.mtab[aria-current="step"]{background:var(--sunny);border-color:var(--sunny)}
.mtab.done::after{content:"✓";position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:var(--r-full);background:var(--mint);display:grid;place-items:center;font:800 12px/1 var(--f-sans)}
.mission{margin-top:var(--gap-lg);scroll-margin-top:80px}
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mhead h2{flex:1;min-width:0}
.mprog{font:800 15px/20px var(--f-sans);color:var(--teal-deep);background:var(--mint-tint);border-radius:var(--r-full);padding:4px 12px}
.brief{font:700 22px/26px var(--f-crayon);color:var(--plum);margin:4px 0 var(--gap-sm)}
.next{display:block;margin:var(--gap-md) auto 0;min-height:60px;font-size:20px;padding:10px 28px}
.next[hidden]{display:none}

/* scenes */
.room{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;background:var(--cloud);border-radius:var(--r-md);padding:10px 12px;font-size:40px;line-height:48px;margin-bottom:8px}
.room .rl{width:100%;text-align:center;font:700 14px/18px var(--f-round);color:var(--plum)}
.opt .room{font-size:28px;line-height:34px;margin:0;padding:8px;background:transparent}
.opt .ic.big{font-size:38px;line-height:44px}

/* error hunt */
.toks{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--gap-sm)}
.tok{min-height:48px;border:2px solid var(--cloud);background:var(--paper);border-radius:var(--r-sm);box-shadow:var(--lift);cursor:pointer;padding:6px 12px;font:800 20px/26px var(--f-sans)}
.tok.found{text-decoration:line-through;color:var(--coral-deep);background:var(--coral-tint);border-color:var(--coral);box-shadow:none}
.fixw{min-height:48px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--r-sm);background:var(--mint-tint);border:2px solid var(--mint);color:var(--teal-deep);font:800 20px/26px var(--f-sans);animation:pop .45s}

/* builder */
.builder{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap-sm)}
.brow{display:flex;align-items:center;gap:8px;background:var(--chalk);border-radius:var(--r-sm);padding:6px 8px}
.brow .ic{font-size:30px;line-height:36px;flex:none}
.brow .bw{flex:1;min-width:0;font:800 16px/20px var(--f-sans)}
.cnt-btn{width:44px;height:44px;border-radius:var(--r-full);border:2px solid var(--cloud);background:var(--paper);box-shadow:var(--lift);font:800 22px/1 var(--f-sans);cursor:pointer;flex:none}
.cnt-btn.plus{background:var(--sunny);border-color:var(--sunny)}
.brow b{width:22px;text-align:center;font:900 22px/1 var(--f-poster)}
.myroom{min-height:84px;margin-top:var(--gap-md);font-size:34px;line-height:42px}
.desc{margin-top:var(--gap-sm);background:var(--paper);border:2px dashed var(--lilac);border-radius:var(--r-md);padding:12px 16px}
.desc p{margin:0;font:700 26px/32px var(--f-crayon)}
.desc .ph{font:600 15px/22px var(--f-sans);color:var(--muted)}
.need{font:700 15px/20px var(--f-sans);color:var(--muted);margin:8px 0 0}
.need span{display:block}
.need .ok{color:var(--teal-deep)}

/* brain break */
.break{text-align:center;background:var(--lilac);border-radius:var(--r-lg);padding:var(--gap-lg) var(--gap-md)}
.break .big{font-size:72px;line-height:84px;font-family:var(--f-emoji)}
.break .task{font-size:22px;line-height:30px}
.break .ru{color:var(--ink)}
.break .btn{background:var(--sunny);border-color:var(--sunny);margin-top:var(--gap-md);min-height:60px;font-size:20px}
@media (max-width:520px){.builder{grid-template-columns:1fr}.bar-title{display:none}.room{font-size:32px;line-height:40px}}
</style>
</head>

function chime(kind){
  if(muted) return;
  try{
    const a=ctx(), notes = kind==="badge" ? [392,493.88,587.33,783.99,987.77] : kind==="bad" ? [220,207.65] : [587.33,880];
    notes.forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+i*0.07;
      o.type = kind==="bad"?"triangle":"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==="bad"?0.05:0.1,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="badge"?0.9:0.4));
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+1); });
  }catch(e){}
}

    const row=el("div","brow",`${ico(w)}<span class="bw">${w}</span>`);
    const minus=el("button","cnt-btn","−"), n=el("b","","0"), plus=el("button","cnt-btn plus","+");
    minus.type="button"; plus.type="button"; minus.setAttribute("aria-label","Remove "+w); plus.setAttribute("aria-label","Add "+w);
    minus.onclick=()=>{ if(lock||counts[w]===0) return; counts[w]--; n.textContent=counts[w]; render(); };
    plus.onclick=()=>{ if(lock||counts[w]>=5) return; counts[w]++; n.textContent=counts[w]; chime("ok"); render(); };
    row.append(minus,n,plus); grid.appendChild(row);
  });
  const room=el("div","room myroom"); card.appendChild(room);
  const desc=el("div","desc"); card.appendChild(desc);
  const need=el("div","need"); card.appendChild(need);
  const tools=el("div","page-tools"), listen=el("button","btn small","🔊 Listen to my room"), ready=el("button","btn","✓ My room is ready!");
  listen.type="button"; ready.type="button"; tools.append(listen,ready); card.appendChild(tools);
  const fb=fbEl(); card.appendChild(fb);
  let lock=false;
  const lines=()=>BUILDER_ITEMS.filter(w=>counts[w]>0).map(w=>counts[w]===1?`There's a ${w}.`:`There are ${NUM[counts[w]]} ${plural(w)}.`);
  function render(){
    const items=BUILDER_ITEMS.filter(w=>counts[w]>0);
    room.innerHTML = items.length ? items.map(w=>ico(w).repeat(counts[w])).join(" ") : '<span class="rl" style="font:600 15px/22px var(--f-sans);color:var(--muted)">Your room is empty… · Комната пока пустая…</span>';
    desc.innerHTML = items.length ? `<p>In my room…</p>`+lines().map(s=>`<p>${s}</p>`).join("") : '<p class="ph">Your sentences will be here · Здесь появятся твои предложения</p>';
    const okTypes=items.length>=3, okMany=items.some(w=>counts[w]>=2);
    need.innerHTML=`<span class="${okTypes?"ok":""}">${okTypes?"✓":"○"} 3 different things · 3 разных предмета</span><span class="${okMany?"ok":""}">${okMany?"✓":"○"} 2+ of one thing (There are…) · 2+ одинаковых</span>`;
    ready.disabled = lock || !(okTypes&&okMany);
  }
  listen.onclick=()=>{ const l=lines(); if(l.length) speak("In my room… "+l.join(" ")); };
  ready.onclick=()=>{ lock=true; ready.disabled=true; grid.querySelectorAll("button").forEach(b=>b.disabled=true);
    chime("ok"); setFb(fb,true,"Awesome room! Now say it to your teacher! 🎤"); award("room",ready); speak("In my room… "+lines().join(" ")); };
  render();
})();

/* =================== HARD =================== */
(function(){
  const B=PANEL.hard.body, zone=el("div","bonus-zone"); B.appendChild(zone);
  BONUS_Q.forEach((t,i)=>{ const pre=el("div",""); pre.innerHTML=roomHTML(t.room); choiceCard(zone,t,"bq"+i,{pre}); });
  BONUS_WRITE.forEach((w,i)=>{
    const card=el("div","card"); zone.appendChild(card);
    card.innerHTML=`<p class="task">Listen and write the word.</p><p class="ru">Послушай и напиши слово.</p>`+roomHTML(w.room);
    const q=el("p","q"); q.append(sayBtn("There are two "+w.word+".","Listen"), el("span","",`There are two`), el("span","blanks","_ ".repeat(w.word.length).trim()));
    card.appendChild(q);
    const row=el("div","write"), inp=el("input"); inp.type="text"; inp.id="bw"+i; inp.autocomplete="off"; inp.setAttribute("autocapitalize","off"); inp.spellcheck=false; inp.setAttribute("aria-label","Write the word");
    const btn=el("button","btn","Check ✓"); btn.type="button"; row.append(inp,btn); const fb=fbEl(); card.append(row,fb);
    inp.oninput=()=>{ inp.style.borderColor=""; inp.style.background=""; };
    const check=()=>{ if(card.classList.contains("solved")) return;
      if(inp.value.trim().toLowerCase()===w.word){ card.classList.add("solved"); inp.disabled=true; btn.disabled=true; inp.style.borderColor="var(--mint)"; inp.style.background="var(--mint-tint)"; chime("ok"); setFb(fb,true); award("bw"+i,btn); }
      else { inp.style.borderColor="var(--coral)"; inp.style.background="var(--coral-tint)"; shake(inp); chime("bad"); setFb(fb,false); } };
    btn.onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  });
})();

/* =================== KEY =================== */
const fin=el("div","final"); fin.style.marginTop="0";
fin.innerHTML=`<p class="task" id="keyMsg">Finish Missions 1–7 to get the key.</p><p class="ru" id="keyRu">Пройди миссии 1–7, чтобы получить ключ.</p>
  <svg class="big-chest chest" id="finalChest" viewBox="0 0 120 100" role="img" aria-label="Treasure chest"></svg>
  <div><button class="key-btn" id="keyBtn" type="button" disabled><span class="emo">🔒</span> Locked</button></div>
  <div class="unlocked"><p class="yay">You unlocked it!</p><p class="task">Mission complete, hero! 🏆</p><p class="ru">Миссия выполнена, герой!</p><div class="final-grid" id="finalGrid"></div></div>`;
PANEL.key.body.appendChild(fin); chestSVG($("#finalChest"));
const keyBtn=$("#keyBtn");
function checkKey(){
  if(!keyBtn.disabled || fin.classList.contains("done")) return;
  if(MAIN.every(id=>done.has(id))){
    keyBtn.disabled=false; keyBtn.classList.add("ready"); keyBtn.innerHTML='<span class="emo">🗝️</span> Tap the key!';
    $("#keyMsg").textContent="You got the golden key! Open the chest!"; $("#keyRu").textContent="У тебя золотой ключ! Открой сундук!";
    TAB.key.classList.add("ready");
  }
}
keyBtn.onclick=()=>{
  keyBtn.disabled=true; keyBtn.innerHTML='<span class="emo">🔓</span> Open!';
  ["#finalChest","#bigChest","#miniChest"].forEach(s=>setOpen($(s)));
  fin.classList.add("done"); $("#keyMsg").textContent="The chest is open!"; $("#keyRu").textContent="Сундук открыт!";
  TAB.key.classList.add("done");
  COLLECTION.forEach(stick);
  const fg=$("#finalGrid"); fg.innerHTML=""; COLLECTION.forEach(w=>{ const s=el("span","",ITEMS[w].e||ITEMS[w].svg); s.title=w; fg.appendChild(s); });
  $("#shelf").querySelectorAll(".stk").forEach(s=>{ const c=el("span","",s.textContent); fg.appendChild(c); });
  const fc=$("#finalChest"), top=fc.offsetTop+fc.offsetHeight/2;
  COLLECTION.filter(w=>ITEMS[w].e).map(w=>ITEMS[w].e).concat(["🪙","🏆","🗝️","⚡","🚀"]).forEach((e,i,arr)=>{
    const a=(i/arr.length)*Math.PI*2-Math.PI/2, r=110+(i%3)*24, b=el("span","burst",e); b.style.top=top+"px";
    b.style.setProperty("--dx",Math.round(Math.cos(a)*r*1.4)+"px"); b.style.setProperty("--dy",Math.round(Math.sin(a)*r*.75)+"px");
    fin.appendChild(b); b.addEventListener("animationend",()=>b.remove()); });
  chime("badge"); speak("You unlocked it! Mission complete, hero!");
};

show("m1",false); updateMProg();

/* =================== self-check (console) =================== */
(function(){
  const bad=[], pos={};
  const chk=(t,tag)=>{ if(!(t.answer>=0&&t.answer<t.options.length)) bad.push(tag); if(new Set(t.options.map(x=>JSON.stringify(x))).size!==t.options.length) bad.push("dup "+tag); (pos[tag.split(":")[0]]=pos[tag.split(":")[0]]||[]).push(t.answer); };
  LISTEN_WORD.forEach((t,i)=>{ chk(t,"m1:"+i); if(t.options[t.answer]!==t.say) bad.push("listen "+t.say); t.options.forEach(o=>{ if(!ITEMS[o]) bad.push("item "+o); }); });
  chk(IS_GAP,"m2:gap"); COUNT.forEach((t,i)=>chk(t,"m4:"+i)); DETECT.forEach((t,i)=>chk(t,"m6:"+i)); BONUS_Q.forEach((t,i)=>chk(t,"hard:"+i));
  // count answers must match the picture
  [["three",0],["lamps",1],["are",2],["is",3]].forEach(([w,i])=>{ if(COUNT[i].options[COUNT[i].answer]!==w) bad.push("count "+i); });
  // detective: spoken sentence must describe exactly the right room
  DETECT.forEach((t,i)=>{ const r=t.options[t.answer].items, txt=t.say.toLowerCase();
    r.forEach(([w,n])=>{ const want = n===1 ? `a ${w}` : `${NUM[n]} ${plural(w)}`; if(!txt.includes(want.toLowerCase())) bad.push("detect "+i+" "+want); });
    t.options.forEach((o,j)=>{ if(j!==t.answer && JSON.stringify(o.items)===JSON.stringify(r)) bad.push("detect twin "+i); }); });
  const srt=a=>a.slice().sort((x,y)=>x-y).join();
  [IS_BUILD].concat(ARE_BUILD).forEach(b=>{ if(srt(b.shown)!==b.words.map((_,i)=>i).join()) bad.push("build "+b.words.join(" ")); if(b.shown.every((v,i)=>v===i)) bad.push("not shuffled"); });
  FIX.forEach((f,i)=>{ if(!(f.bad>=0&&f.bad<f.words.length)) bad.push("fix "+i); });
  SORT.items.forEach(it=>{ const many=/^(two|three|four|five) /.test(it.t); if((it.b==="are")!==many) bad.push("sort "+it.t); });
  if(slots.children.length!==ALL.length) bad.push("slots");
  console.log(bad.length?"CHECK FAILED: "+bad.join(" | "):"Lesson check OK: "+ALL.length+" coins ("+MAIN.length+" main + "+BONUS.length+" bonus). Answer positions: "+JSON.stringify(pos));
})();

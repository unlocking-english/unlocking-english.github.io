<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocking English with Val · Kids · British Bulldog Prep · 5–6 · Contest Instructions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@700&family=Nunito:wght@600;700;800&family=Playfair+Display:wght@900&display=swap&subset=cyrillic" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --chalk:#FBFAF7;--paper:#FFFFFF;--cloud:#EDEDEB;
  --coral:#F4776A;--sunny:#F7B84B;--mint:#86D3B5;--bubblegum:#F7A6BC;--lilac:#A9A6EE;--lemon:#F5DE3D;
  --ink:#3B2A1F;--muted:#6E6460;--coral-deep:#B8442F;--teal-deep:#1F6B57;--plum:#5A4FB0;
  --coral-tint:#FDE7E3;--mint-tint:#E3F5EC;--wood:#6F4E37;
  --f-poster:"Playfair Display",Georgia,serif;--f-round:"Comfortaa","Nunito",system-ui,sans-serif;
  --f-sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--f-crayon:"Caveat",cursive;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-sm:14px;--r-md:22px;--r-lg:32px;--r-full:999px;--lift:0 6px 0 rgba(59,42,31,.10);
}
*{box-sizing:border-box;animation:none!important;transition:none!important}
html{scroll-behavior:auto}
body{margin:0;background:var(--chalk);color:var(--ink);font:600 20px/30px var(--f-sans)}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
.emo{font-family:var(--f-emoji);font-weight:400}
.ru{font:600 17px/25px var(--f-sans);color:var(--muted);margin:4px 0 0}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--chalk);border-bottom:2px dashed var(--cloud)}
.bar-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab{min-height:48px;border:2px solid var(--cloud);background:var(--paper);border-radius:var(--r-sm);padding:4px 12px;font:800 16px/20px var(--f-sans);cursor:pointer}
.tab small{display:block;font:700 12px/14px var(--f-sans);color:var(--muted)}
.tab[aria-current="step"]{background:var(--sunny);border-color:var(--sunny)}
.tab[aria-current="step"] small{color:var(--ink)}
.tab.done{border-color:var(--mint)}
.tab.done::after{content:" ✓";color:var(--teal-deep)}
.score-pill{font:800 18px/24px var(--f-sans);color:var(--teal-deep);background:var(--mint-tint);border-radius:var(--r-full);padding:6px 14px;white-space:nowrap}
.mute{width:48px;height:48px;border-radius:var(--r-full);border:2px solid var(--cloud);background:var(--paper);cursor:pointer;font-size:22px}

/* header */
header{text-align:center;padding:24px 0 8px}
.logo{width:170px;height:auto;display:block;margin:0 auto 10px}
.label{display:inline-block;background:var(--mint);font:800 15px/20px var(--f-sans);padding:6px 14px;border-radius:var(--r-full)}
h1{font:900 46px/50px var(--f-poster);margin:12px 0 4px}
.tagline{font:700 30px/34px var(--f-crayon);color:var(--coral-deep);margin:0}

/* sections */
section[hidden]{display:none}
.sec-head{display:flex;align-items:center;gap:14px;margin:28px 0 6px;flex-wrap:wrap}
.num{flex:none;width:52px;height:52px;border-radius:var(--r-full);background:var(--coral);display:grid;place-items:center;font:700 24px/1 var(--f-round)}
h2{font:700 30px/36px var(--f-round);margin:0;flex:1;min-width:0}
.mins{font:800 16px/20px var(--f-sans);background:var(--cloud);border-radius:var(--r-full);padding:4px 12px}
.goal{background:var(--mint-tint);border-radius:var(--r-md);padding:10px 16px;margin:8px 0 18px;font:700 18px/26px var(--f-sans)}

/* task cards */
.card{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--lift);padding:20px;margin-bottom:18px}
.card.solved{background:var(--mint-tint)}
.instr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.instr b{font:800 22px/30px var(--f-sans)}
.hintbtn{min-height:44px;border:2px dashed var(--sunny);background:#FFFBEF;border-radius:var(--r-full);padding:2px 14px;font:800 16px/22px var(--f-sans);cursor:pointer}
.hint{display:none;margin:0 0 10px;background:#FFFBEF;border-radius:var(--r-sm);padding:8px 14px;font:700 18px/26px var(--f-sans)}
.hint.show{display:block}
.q{font:800 24px/34px var(--f-sans);margin:6px 0 4px}
.q .big{font-size:60px;line-height:70px;font-family:var(--f-emoji);display:block}
.qno{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:var(--r-full);background:var(--cloud);font:800 17px/1 var(--f-sans);margin-right:8px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.opt,.tile,.mbtn,.chip{position:relative;min-height:60px;border:3px solid var(--cloud);background:var(--paper);border-radius:var(--r-sm);box-shadow:var(--lift);cursor:pointer;padding:10px 16px;font:800 21px/28px var(--f-sans);text-align:left}
.opt b.l{color:var(--plum);margin-right:6px}
.opt:focus-visible,.tile:focus-visible,.mbtn:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:4px solid var(--lilac);outline-offset:2px}
.opt.ok,.chip.ok{background:var(--mint-tint);border-color:var(--lilac);outline:3px solid var(--mint);color:var(--teal-deep)}
.opt.ok::after,.chip.ok::after{content:" ✓"}
.opt.no,.chip.no,.mbtn.no{background:var(--coral-tint);border-color:var(--coral);color:var(--coral-deep);text-decoration:line-through;opacity:.8}
.opt.no::after{content:" ✗"}
.opt.fade{opacity:.55}
.opt[disabled],.chip[disabled],.mbtn[disabled],.tile[disabled]{cursor:default}
.fb{min-height:30px;margin-top:12px;font:800 20px/28px var(--f-sans)}
.fb.ok{color:var(--teal-deep)}
.fb.no{color:var(--coral-deep)}
.fb .why{display:block;font:700 18px/26px var(--f-sans);color:var(--ink);background:var(--coral-tint);border-radius:var(--r-sm);padding:6px 12px;margin-top:6px}
.btn{min-height:56px;border:none;border-radius:var(--r-sm);background:var(--coral);box-shadow:var(--lift);padding:8px 22px;font:800 20px/26px var(--f-sans);cursor:pointer}
.btn.small{min-height:48px;font-size:17px;background:var(--lemon)}
.btn[disabled]{background:var(--cloud);color:var(--muted);cursor:default}
.next{display:block;margin:10px auto 0}

/* order */
.answer{min-height:70px;border:3px dashed var(--cloud);border-radius:var(--r-sm);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.answer .ph{color:var(--muted);font-size:17px;padding:0 6px}
.placed{background:var(--mint-tint);border:2px solid var(--mint);border-radius:var(--r-sm);padding:8px 14px;font:800 21px/28px var(--f-sans)}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile.used{visibility:hidden}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mbtn{text-align:center}
.mbtn.sel{border-color:var(--plum);background:#EFEEFC}
.mbtn.done{background:var(--mint-tint);border-color:var(--mint);color:var(--teal-deep);box-shadow:none;cursor:default}
.mbtn .emo{font-size:34px;line-height:40px;vertical-align:middle}
.tag{display:inline-block;background:var(--sunny);border-radius:var(--r-full);padding:0 8px;font:800 15px/24px var(--f-sans);margin-right:6px;color:var(--ink)}

/* bank */
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{min-height:52px;font-size:19px;padding:6px 14px;text-align:center}
.gap{display:inline-block;min-width:120px;border-bottom:3px solid var(--plum);text-align:center;color:var(--plum)}

/* words poster */
.words{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wcard{background:var(--cloud);border:none;border-radius:var(--r-md);padding:10px 4px;text-align:center;cursor:pointer;min-height:44px}
.wcard .emo{display:block;font-size:44px;line-height:52px}
.wcard b{display:block;font:800 19px/24px var(--f-sans)}
.wcard span{display:block;font:600 15px/20px var(--f-sans);color:var(--muted)}

/* reading */
.text{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--lift);padding:20px 24px;font:600 23px/38px var(--f-sans);margin-bottom:18px}
.text mark{background:var(--lemon);color:var(--ink);border-radius:6px;padding:0 3px;outline:3px solid var(--sunny)}

/* quiz */
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--lift);padding:14px 20px;margin-bottom:18px}
.timer .clock{font:900 44px/48px var(--f-poster);font-variant-numeric:tabular-nums;color:var(--plum)}
.timer .clock.low{color:var(--coral-deep)}

/* results */
.res-big{font:900 64px/68px var(--f-poster);color:var(--plum);text-align:center;margin:6px 0}
table{width:100%;border-collapse:collapse;font:700 19px/28px var(--f-sans);font-variant-numeric:tabular-nums}
td,th{padding:8px;border-bottom:1px solid var(--cloud);text-align:left}
td:last-child,th:last-child{text-align:right}
.types{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.type{border-radius:var(--r-full);padding:6px 14px;font:800 18px/24px var(--f-sans)}
.t-instruction{background:#FDF0D6}.t-word{background:#E4E2FB}.t-grammar{background:var(--mint-tint)}.t-text{background:#FCE4EC}.t-attention{background:var(--coral-tint)}
.mist{border-left:6px solid var(--coral);background:var(--paper);border-radius:var(--r-sm);padding:10px 14px;margin:8px 0;font:700 18px/26px var(--f-sans)}
.mist .ru{margin:2px 0 0}
.chest{display:block;width:170px;height:142px;margin:10px auto}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0}
.namebox input{min-width:220px;min-height:52px;border:2px solid var(--cloud);border-radius:var(--r-sm);padding:6px 14px;font:800 20px/26px var(--f-sans);color:var(--ink);background:var(--paper)}
footer{text-align:center;margin-top:40px;color:var(--muted);font-size:15px}
footer img{width:140px;display:block;margin:0 auto 6px}
@media (max-width:640px){
  body{font-size:18px}
  h1{font-size:34px;line-height:38px}
  .words{grid-template-columns:repeat(2,1fr)}
  .match{gap:8px}.mbtn{font-size:17px;padding:8px}
  .text{font-size:19px;line-height:32px;padding:14px}
  .opts{grid-template-columns:1fr}
}
</style>

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
let muted=false, actx=null;
function chime(kind){ if(muted) return; try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
  const notes=kind==="badge"?[392,493.88,587.33,783.99,987.77]:kind==="bad"?[220,207.65]:[587.33,880];
  notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.07; o.type=kind==="bad"?"triangle":"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==="bad"?0.05:0.1,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="badge"?0.9:0.4)); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+1); }); }catch(e){} }
let voice=null; const FEMALE=/(Kate|Serena|Hazel|Sonia|Libby|Martha|Susan|Female|Tessa|Karen|Samantha)/i;
function pickVoice(){ if(!("speechSynthesis" in window)) return; const en=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)), gb=en.filter(v=>/GB/i.test(v.lang)); voice=gb.find(v=>FEMALE.test(v.name))||gb[0]||en[0]||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(muted||!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=.85; if(voice) u.voice=voice; speechSynthesis.speak(u); }
$("#mute").onclick=()=>{ muted=!muted; $("#mute").textContent=muted?"🔇":"🔊"; $("#mute").setAttribute("aria-label",muted?"Sound off":"Sound on"); };

/* scoring: first try per item */
const RES={};          // id → {sec, ok}
const MIST=[];         // first mistakes
const TOTAL={};        // sec → count
function regItem(sec,id){ TOTAL[sec]=(TOTAL[sec]||0)+1; }
function record(sec,id,ok,info){
  if(RES[id]) return; RES[id]={sec,ok};
  if(!ok) MIST.push(Object.assign({sec},info));
  updateScore();
}
function updateScore(){ const n=Object.values(RES).length, ok=Object.values(RES).filter(r=>r.ok).length, tot=Object.values(TOTAL).reduce((a,b)=>a+b,0); $("#scorePill").textContent=`✓ ${ok} / ${tot}`; }
function fbOk(fb,t){ fb.className="fb ok"; fb.innerHTML="✓ "+(t||"Correct! Верно!"); }
function fbNo(fb,why,correct){ fb.className="fb no"; fb.innerHTML=`✗ Not quite.${correct?` Правильно: <b>${correct}</b>.`:""}<span class="why">💡 ${why}</span>`; }

function instrLine(card,en,ru){
  const d=el("div","instr",`<b>${en}</b>`); const b=el("button","hintbtn","🇷🇺 Перевод"); b.type="button";
  const h=el("p","hint","🇷🇺 "+ru); b.onclick=()=>h.classList.toggle("show"); d.appendChild(b); card.append(d,h);
}

/* choice card. o.single = one try (quiz); o.letters = A–D */
function choice(parent,sec,id,t,o={}){
  regItem(sec,id);
  const card=el("div","card"); if(o.instr) instrLine(card,o.instr[0],o.instr[1]);
  if(o.pre) card.appendChild(o.pre);
  if(t.q) card.appendChild(el("p","q",(o.no?`<span class="qno">${o.no}</span>`:"")+t.q));
  const opts=el("div","opts"), fb=el("div","fb"); fb.setAttribute("aria-live","polite"); card.append(opts,fb);
  const label=(x,j)=>o.letters?`<b class="l">${"ABCD"[j]})</b>${x}`:x;
  t.options.forEach((x,j)=>{ const b=el("button","opt",label(x,j)); b.type="button";
    b.onclick=()=>{ if(card.classList.contains("solved")||card.dataset.locked) return;
      const ok=j===t.answer, correctTxt=t.options[t.answer];
      record(sec,id,ok,{type:t.type,q:t.q||o.qtext||"",chosen:x,correct:correctTxt,why:t.why});
      if(ok){ b.classList.add("ok"); card.classList.add("solved"); opts.querySelectorAll(".opt").forEach(z=>{ z.disabled=true; if(z!==b) z.classList.add("fade"); }); chime("ok"); fbOk(fb); o.onOk&&o.onOk(); }
      else { b.classList.add("no"); b.disabled=true; chime("bad");
        if(o.single){ card.dataset.locked="1"; const c=opts.children[t.answer]; c.classList.add("ok"); opts.querySelectorAll(".opt").forEach(z=>z.disabled=true); fbNo(fb,t.why,correctTxt); o.onOk&&o.onOk(); }
        else fbNo(fb,t.why); }
      o.after&&o.after();
    };
    opts.appendChild(b); });
  parent.appendChild(card); return card;
}

/* order */
function order(parent,sec,id,t,instr){
  regItem(sec,id);
  const card=el("div","card"); instrLine(card,instr[0],instr[1]);
  const ans=el("div","answer",'<span class="ph">…</span>'), tiles=el("div","tiles"), fb=el("div","fb"); card.append(ans,tiles,fb); parent.appendChild(card);
  let step=0;
  t.shown.forEach(i=>{ const b=el("button","tile",t.words[i]); b.type="button";
    b.onclick=()=>{ if(t.words[i]===t.words[step]){ if(step===0) ans.innerHTML=""; ans.appendChild(el("span","placed",t.words[i])); b.classList.add("used"); b.disabled=true; step++;
        if(step===t.words.length){ record(sec,id,true); card.classList.add("solved"); tiles.remove(); chime("ok"); fbOk(fb,"Correct! "+t.words.join(" ")); } else fb.textContent=""; }
      else { record(sec,id,false,{type:t.type,q:"Put in order: "+t.words.join(" / "),chosen:t.words[i]+" (не на своём месте)",correct:t.words.join(" "),why:t.why}); chime("bad"); fbNo(fb,t.why); } };
    tiles.appendChild(b); });
}

/* match */
function match(parent,sec,id,t,instr){
  regItem(sec,id);
  const card=el("div","card"); instrLine(card,instr[0],instr[1]);
  const wrap=el("div","match"), L=el("div","mcol"), R=el("div","mcol"), fb=el("div","fb"); wrap.append(L,R); card.append(wrap,fb); parent.appendChild(card);
  let sel=null, left=t.pairs.length, tag=0;
  const lb=t.left.map((x,i)=>{ const b=el("button","mbtn",x); b.type="button"; b.onclick=()=>{ if(b.classList.contains("done")) return; lb.forEach(z=>z.classList.remove("sel")); b.classList.add("sel"); sel=i; speak(x); }; L.appendChild(b); return b; });
  t.right.forEach((x,j)=>{ const b=el("button","mbtn",/\p{Extended_Pictographic}/u.test(x)?`<span class="emo">${x}</span>`:x); b.type="button";
    b.onclick=()=>{ if(b.classList.contains("done")) return; if(sel===null){ fb.className="fb no"; fb.textContent="Сначала нажми слово слева."; return; }
      if(t.pairs.some(p=>p[0]===sel&&p[1]===j)){ tag++; lb[sel].classList.remove("sel"); lb[sel].classList.add("done"); lb[sel].disabled=true; lb[sel].prepend(el("span","tag",String(tag))); b.classList.add("done"); b.disabled=true; b.prepend(el("span","tag",String(tag))); sel=null; left--; chime("ok");
        if(left===0){ record(sec,id,true); card.classList.add("solved"); fbOk(fb,"All pairs! Все пары верно."); } else { fb.className="fb ok"; fb.textContent="✓"; } }
      else { record(sec,id,false,{type:t.type,q:"Match: "+t.left.join(", "),chosen:t.left[sel]+" → "+x,correct:t.pairs.map(p=>t.left[p[0]]+" → "+t.right[p[1]]).join("; "),why:t.why}); chime("bad"); fbNo(fb,t.why); } };
    R.appendChild(b); });
}

/* gap with word bank */
function gapBank(parent,sec,id,t,instr){
  regItem(sec,id);
  const card=el("div","card"); instrLine(card,instr[0],instr[1]);
  const q=el("p","q",t.q.replace("___",'<span class="gap">…</span>')); card.appendChild(q);
  const bank=el("div","bank"), fb=el("div","fb"); card.append(bank,fb); parent.appendChild(card);
  WORDS.forEach(w=>{ const b=el("button","chip",w.en); b.type="button";
    b.onclick=()=>{ if(card.classList.contains("solved")) return;
      if(w.en===t.answer){ record(sec,id,true); b.classList.add("ok"); q.querySelector(".gap").textContent=t.answer; card.classList.add("solved"); bank.querySelectorAll(".chip").forEach(z=>z.disabled=true); chime("ok"); fbOk(fb); }
      else { record(sec,id,false,{type:t.type,q:t.q,chosen:w.en,correct:t.answer,why:t.why}); b.classList.add("no"); b.disabled=true; chime("bad"); fbNo(fb,t.why); } };
    bank.appendChild(b); });
}

  const t=el("div","card"); t.innerHTML=`<p class="q">By part · По частям</p><table><tr><th>Part</th><th>Score</th></tr>${PARTS.filter(p=>TOTAL[p.k]).map(p=>{ const ids=Object.entries(RES).filter(([,r])=>r.sec===p.k); return `<tr><td>${p.n}. ${p.title}</td><td>${ids.filter(([,r])=>r.ok).length} / ${TOTAL[p.k]}</td></tr>`; }).join("")}</table>`; B.appendChild(t);
  const ty=el("div","card"); const counts={}; MIST.forEach(m=>counts[m.type]=(counts[m.type]||0)+1);
  ty.innerHTML=`<p class="q">Mistakes by type · Ошибки по типам</p><div class="types">${Object.keys(TYPES).map(k=>`<span class="type t-${k}">${TYPES[k]}: ${counts[k]||0}</span>`).join("")}</div>`;
  if(!MIST.length) ty.appendChild(el("p","ru","Ошибок нет — отлично! 🏆"));
  Object.keys(TYPES).forEach(k=>{ const list=MIST.filter(m=>m.type===k); if(!list.length) return; ty.appendChild(el("p","q",`<span class="type t-${k}">${TYPES[k]}</span>`));
    list.forEach(m=>ty.appendChild(el("div","mist",`${m.q.replace(/<[^>]+>/g," ").trim()}<br>✗ ${m.chosen} → ✓ <b>${m.correct}</b><p class="ru">💡 ${m.why}</p>`))); });
  B.appendChild(ty);
  chime("badge");
}

show("p1"); updateScore();

/* self-check */
(function(){ const bad=[];
  const W=WORDS.map(w=>w.en);
  PRACT.gap.forEach(g=>{ if(!W.includes(g.answer)) bad.push("gap "+g.answer); });
  INSTR.forEach(t=>{ if(!t.opts.includes(t.act)) bad.push("instr "+t.en); if(new Set(t.opts).size!==4) bad.push("instr dup"); });
  [...PRACT.choose,...PRACT.odd,...PRACT.text,...READ_Q,...QUIZ].forEach(t=>{ if(!(t.answer>=0&&t.answer<t.options.length)) bad.push("ans "+t.q); if(new Set(t.options).size!==t.options.length) bad.push("dup "+t.q); if(!TYPES[t.type]) bad.push("type "+t.q); });
  PRACT.order.forEach(t=>{ if(t.shown.slice().sort((a,b)=>a-b).join()!==t.words.map((_,i)=>i).join()) bad.push("order"); });
  READ_Q.forEach(q=>{ if(q.ev && !READ_TEXT.includes("[["+q.ev+"|")) bad.push("ev "+q.ev); });
  const words=READ_TEXT.replace(/\[\[\w+\|([^\]]+)\]\]/g,"$1").split(/\s+/).length; if(words<60||words>80) bad.push("text length "+words);
  if(QUIZ.length!==10) bad.push("quiz 10");
  console.log(bad.length?"CHECK FAILED: "+bad.join(" | "):"Check OK · reading text "+words+" words · quiz answers "+QUIZ.map(q=>"ABCD"[q.answer]).join(""));
})();

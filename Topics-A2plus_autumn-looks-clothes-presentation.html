<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Looks · Unlocking English with Val</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--besh:#F9F6F0;--paper:#FFFFFF;--sand:#EFE6DC;--hazelnut:#CFB59E;--coffee:#6F4E37;--espresso:#4A3426;--ink:#3B2A1F;--muted:#7A6555;--line:#E6DBCF;--mist:#E4EEF5;--denim:#3E6A8A;--correct:#3F6643;--correct-tint:#E7F0E6;--wrong:#A4483A;--wrong-tint:#F6E3DF;
  --f-display:"Playfair Display",Georgia,serif;--f-sans:"Montserrat",system-ui,sans-serif;--f-script:"Marck Script",cursive;--rose:#C9937B;--rust:#9B5A3C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9DFD3;color:var(--ink);font:400 15px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.deck{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(249,246,240,.92);border-bottom:1px solid var(--line);z-index:5}
.bar img{height:30px;width:auto;user-select:none}
.bar .ttl{font:600 14px/1 var(--f-display);color:var(--coffee);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.dot{flex:none;height:28px;min-width:28px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.dot.on{background:var(--coffee);border-color:var(--coffee);color:#fff}
.ib{flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:28px clamp(16px,4vw,56px) 90px;background:radial-gradient(1200px 600px at 100% 0%,#F6EBDD 0%,transparent 60%),radial-gradient(900px 500px at 0% 100%,#EFE2D3 0%,transparent 60%),var(--besh);opacity:0;visibility:hidden;transition:opacity .35s ease}
.slide.on{opacity:1;visibility:visible}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:6;background:rgba(74,52,38,.9);border-radius:999px;padding:6px 8px;box-shadow:0 8px 20px rgba(74,52,38,.25)}
.nav button{width:40px;height:40px;border-radius:999px;border:0;background:#fff;color:var(--coffee);font-size:16px;cursor:pointer}
.nav .cnt{color:#fff;font-weight:600;font-size:13px;min-width:52px;text-align:center}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
h1,h2{font-family:var(--f-display);color:var(--espresso);margin:6px 0 10px}
h1{font-size:clamp(40px,7vw,84px);line-height:1}h1 em,h2 em{font-style:italic;color:var(--rust)}
h2{font-size:clamp(26px,3.6vw,40px);line-height:1.15}
.ru{color:var(--muted);font-size:13.5px}
.script{font:400 clamp(24px,3vw,34px)/1.2 var(--f-script);color:var(--coffee)}
.wrap{max-width:1180px;margin:0 auto}
/* title */
.title{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,4vw,48px);align-items:center;min-height:100%}
.photo{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px rgba(74,52,38,.25);aspect-ratio:716/1238;max-height:78vh;justify-self:center;width:100%;max-width:420px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ribbon{width:70px;height:auto;user-select:none}
.title .lead{font-size:17px;line-height:1.6;max-width:560px}
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.look{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(74,52,38,.06)}
.look b{display:block;font:700 16px/1.2 var(--f-display);color:var(--coffee)}.look span{font-size:22px}.look small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.task{background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px 20px;box-shadow:0 6px 16px rgba(74,52,38,.06)}
.task ol{margin:8px 0 0;padding-left:20px;line-height:1.8}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.step{background:linear-gradient(160deg,#FFF8EE,#F4E5D2);border-radius:16px;padding:14px;border:1px solid #EAD6BE}.step b{font:700 34px/1 var(--f-display);color:var(--rust)}.step p{margin:6px 0 0}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.vi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .15s,border-color .15s;box-shadow:0 3px 10px rgba(74,52,38,.05)}
.vi img{height:110px;width:100%;object-fit:contain;pointer-events:none}
.vi b{font-size:14.5px;line-height:1.25;color:var(--espresso)}.vi small{font-size:12px;color:var(--muted)}
.vi.heard{border-color:var(--correct)}
@media (hover:hover){.vi:hover{transform:translateY(-2px);border-color:var(--rose)}.dot:hover,.ib:hover{border-color:var(--coffee)}}
.cat{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font:700 15px var(--f-sans);color:var(--coffee)}
.cat::after{content:"";width:60px;height:2px;background:var(--hazelnut)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
/* words */
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 12px rgba(74,52,38,.05)}
.box h3{margin:0 0 8px;font:700 18px/1.2 var(--f-display);color:var(--coffee)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--besh);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip small{color:var(--muted)}
.phr{display:flex;flex-direction:column;gap:8px}
.phr button{text-align:left;border:1px solid var(--line);background:var(--besh);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px}
.phr button i{font-style:normal;color:var(--rust);font-weight:600}
/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:center;margin-top:10px}
.qimg{background:#fff;border-radius:22px;border:1px solid var(--line);height:min(46vh,380px);display:grid;place-items:center;padding:16px}
.qimg img{max-height:100%;max-width:100%;object-fit:contain}
.qopts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:600;text-align:left;cursor:pointer;transition:opacity .2s}
.opt.ok{border-color:var(--correct);background:var(--correct-tint);color:var(--correct)}
.opt.no{border-color:var(--wrong);background:var(--wrong-tint);color:var(--wrong);text-decoration:line-through;opacity:.7}
.opt.fade{opacity:.4}.opt:disabled{cursor:default}
.qbar{display:flex;align-items:center;gap:12px;margin-top:14px}
.score{font-weight:700;color:var(--coffee)}
.btn{border:0;background:var(--coffee);color:#fff;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--coffee);border:1px solid var(--line)}
.msg{font-weight:600}.msg.ok{color:var(--correct)}.msg.no{color:var(--wrong)}
.shake{animation:sh .35s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 4px 12px rgba(74,52,38,.05);max-height:calc(100dvh - 210px);overflow-y:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:-10px;background:#fff;padding:6px 0;z-index:1}
.tab{border:1px solid var(--line);background:var(--besh);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--rust);border-color:var(--rust);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.it{position:relative;border:2px solid var(--line);background:var(--besh);border-radius:12px;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.it img{height:66px;width:100%;object-fit:contain;pointer-events:none}.it span{font-size:11px;line-height:1.2;text-align:center}
.it.on{border-color:var(--correct);background:var(--correct-tint)}.it.on::after{content:"✓";position:absolute;top:3px;right:5px;font-size:12px;font-weight:700;color:var(--correct)}
.canvasWrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.canvas{position:relative;height:min(calc(100dvh - 300px),640px);min-height:420px;aspect-ratio:419/1200;background:radial-gradient(circle at 50% 40%,#FFF 0%,#F4E8DA 70%);border-radius:24px;border:1px solid var(--line);touch-action:none}
.canvas .doll{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.wear{position:absolute;transform:translate(-50%,-50%);cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.wear img{display:block;width:100%;height:auto;pointer-events:none}
.wear.sel{outline:2px dashed var(--rust);outline-offset:3px}
.wear:active{cursor:grabbing}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tools button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.tools button:disabled{opacity:.4;cursor:default}
.desc .lk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.desc .lk button{border:1px solid var(--line);background:var(--besh);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.desc .lk button.on{background:var(--coffee);color:#fff;border-color:var(--coffee)}
.sentence{background:var(--besh);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.6;min-height:70px}
.sentence b{color:var(--rust)}
.desc textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;resize:vertical;min-height:90px;margin-top:8px}
.checks{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13.5px}
.checks span.on{color:var(--correct);font-weight:600}
/* present */
.frame{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.fr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.fr b{display:block;color:var(--rust);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.fr p{margin:0;font-size:16.5px;line-height:1.55}
.qs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.final{text-align:center;margin-top:24px}.final .big{font:400 clamp(30px,4vw,44px)/1.1 var(--f-script);color:var(--coffee)}
@media (max-width:900px){.title{grid-template-columns:1fr}.photo{max-height:46vh;max-width:300px}.looks{grid-template-columns:1fr 1fr}.studio{grid-template-columns:1fr}.panel{max-height:none}.canvas{height:min(70vh,560px)}.cols2,.quiz,.frame,.steps{grid-template-columns:1fr}.qimg{height:240px}}
@media (max-width:420px){.bar .ttl{display:none}.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.vi img{height:90px}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>

<style>
:root{
  --chalk:#FBFAF7;--paper:#FFFFFF;--cloud:#EDEDEB;
  --coral:#F4776A;--sunny:#F7B84B;--mint:#86D3B5;--bubblegum:#F7A6BC;--lilac:#A9A6EE;--lemon:#F5DE3D;
  --ink:#3B2A1F;--muted:#6E6460;--coral-deep:#B8442F;--teal-deep:#1F6B57;--plum:#5A4FB0;
  --coral-tint:#FDE7E3;--mint-tint:#E3F5EC;--wood:#6F4E37;
  --f-poster:"Playfair Display",Georgia,serif;--f-round:"Comfortaa","Nunito",system-ui,sans-serif;
  --f-sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--f-crayon:"Caveat",cursive;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-sm:14px;--r-md:22px;--r-lg:32px;--r-full:999px;--lift:0 6px 0 rgba(59,42,31,.10);
  --clock-face:#FFFFFF;--hand-h:#3B2A1F;--hand-m:#F4776A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--chalk) radial-gradient(circle at 12px 12px, rgba(169,166,238,.13) 2px, transparent 2.5px) 0 0/28px 28px;color:var(--ink);font:600 18px/1.5 var(--f-sans);-webkit-text-size-adjust:100%}
.emo{font-family:var(--f-emoji);font-weight:400}
.bar{position:sticky;top:0;z-index:20;background:var(--chalk);border-bottom:2px dashed var(--cloud)}
.bar-in{max-width:660px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar-in .mini{width:40px;height:34px}
.coins{font:900 19px/24px var(--f-sans);color:var(--teal-deep);background:var(--mint-tint);border-radius:var(--r-full);padding:6px 14px;white-space:nowrap}
.bar-in .sp{flex:1}
.mute{width:44px;height:44px;border-radius:var(--r-full);border:2px solid var(--cloud);background:var(--paper);cursor:pointer;font-size:20px}
main{max-width:660px;margin:0 auto;padding:6px 16px 60px}
header{text-align:center;padding:18px 0 4px}
.logo{width:150px;height:auto;display:block;margin:0 auto 8px;cursor:default}
.label{display:inline-block;background:var(--mint);font:800 14px/20px var(--f-sans);padding:5px 14px;border-radius:var(--r-full)}
h1{font:900 36px/42px var(--f-poster);margin:10px 0 4px}
.tagline{font:700 26px/30px var(--f-crayon);color:var(--coral-deep);margin:0 0 6px}
h2{font:900 26px/32px var(--f-poster);margin:0 0 8px}
p{margin:0 0 12px}
.lead{color:var(--muted);text-align:center}
.card{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--lift);padding:18px;margin:16px 0;border:2px solid var(--cloud)}
.scard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
.scard .num{width:52px;height:52px;border-radius:50%;background:var(--sunny);display:flex;align-items:center;justify-content:center;font:900 24px/1 var(--f-poster)}
.scard.s2 .num{background:var(--lilac);color:#fff}
.scard .btn{grid-column:1/-1;justify-self:start}
.status{color:var(--muted);font-size:16px;margin:0 0 6px}
.status b{color:var(--teal-deep)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;min-height:50px;padding:10px 24px;border-radius:var(--r-full);border:none;background:var(--coral);color:#fff;font:900 18px/24px var(--f-sans);box-shadow:0 4px 0 var(--coral-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-deep)}
.btn.sec{background:var(--paper);color:var(--plum);border:2px solid var(--lilac);box-shadow:0 4px 0 var(--lilac)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font:700 15px/20px var(--f-sans);color:var(--muted)}
.back{background:none;border:none;color:var(--plum);padding:8px 0;min-height:44px;font-weight:800}
.pbar{height:12px;background:var(--cloud);border-radius:6px;overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sunny));width:0;transition:width .3s}
.tag{display:inline-block;font:800 13px/20px var(--f-sans);color:var(--coral-deep);background:var(--coral-tint);border-radius:var(--r-full);padding:2px 10px;margin-bottom:8px}
.rule{font:600 15px/22px var(--f-sans);color:var(--ink);background:#F4F3FD;border-left:4px solid var(--lilac);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:8px 12px;margin-bottom:12px}
.q{font:800 22px/1.35 var(--f-sans);margin-bottom:16px}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--plum);margin:0 4px;transform:translateY(-4px)}
.opts{display:grid;gap:10px}
.opt{position:relative;display:block;width:100%;text-align:left;min-height:54px;padding:12px 16px;border-radius:var(--r-sm);border:3px solid var(--cloud);background:var(--paper);font:700 18px/24px var(--f-sans);box-shadow:var(--lift)}
.opt:hover:not(:disabled){border-color:var(--lilac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--mint);background:var(--mint-tint)}
.opt.bad{border-color:var(--coral);background:var(--coral-tint)}
.opt.shake{animation:shake .4s}
.opt b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--sunny);margin-right:10px;font-weight:900}
.opt.ok b{background:var(--mint)} .opt.bad b{background:var(--coral);color:#fff}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:16px;padding:14px;border-radius:var(--r-sm);background:var(--chalk);border:2px dashed var(--cloud)}
.fb .h{font:900 20px/26px var(--f-sans);margin-bottom:4px}
.fb .h.ok{color:var(--teal-deep)} .fb .h.bad{color:var(--coral-deep)}
.fb p{margin:0 0 12px}
.clockbox{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
.clockbox svg{width:220px;height:220px;filter:drop-shadow(0 6px 0 rgba(59,42,31,.10))}
.clockbox .its{font:700 30px/34px var(--f-crayon);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px 6px;border-bottom:1px solid var(--cloud);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:14px}
.words td:first-child{font-weight:800;color:var(--plum)}
.final{text-align:center}
.final table{text-align:left}
.score{font:900 52px/1.1 var(--f-poster);margin:6px 0;color:var(--plum)}
.cheer{font:700 30px/34px var(--f-crayon);color:var(--coral-deep);margin:6px 0 14px}
.chestwrap{position:relative;display:inline-block;margin:6px 0}
.big-chest{width:170px;height:142px}
.lid{transform-origin:16px 46px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.chest.open .lid{transform:translateY(-6px) rotate(-28deg)}
.glow{opacity:0;transition:opacity .5s}
.chest.open .glow{opacity:1}
.prize{font:900 20px/26px var(--f-sans);background:var(--lemon);border-radius:var(--r-md);padding:10px 14px;margin:10px 0;display:inline-block}
.burst{position:absolute;left:50%;top:40%;font-size:28px;font-family:var(--f-emoji);pointer-events:none;animation:burst .6s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
.flycoin{position:fixed;z-index:50;font-size:28px;pointer-events:none;font-family:var(--f-emoji);transition:transform .55s ease-in,opacity .55s ease-in}
.copyline{width:100%;font:600 15px/1.4 var(--f-sans);padding:10px;border-radius:var(--r-sm);border:2px solid var(--cloud);background:var(--chalk);color:var(--ink);resize:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.note{font-size:15px;color:var(--muted)}
.shot{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--lemon);font-weight:800}
.foot{text-align:center;font:700 15px/20px var(--f-sans);color:var(--muted);margin-top:24px}
@media (max-width:380px){ h1{font-size:30px;line-height:36px} .q{font-size:20px} .opt{font-size:17px} .clockbox svg{width:200px;height:200px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

h3{font:900 22px/28px var(--f-poster);margin:0 0 10px}
.theory{border-color:var(--lilac)}
.thtag{display:inline-block;font:800 13px/20px var(--f-sans);color:#fff;background:var(--lilac);border-radius:var(--r-full);padding:2px 10px;margin-bottom:8px}
.testtag{display:inline-block;font:800 13px/20px var(--f-sans);color:var(--ink);background:var(--sunny);border-radius:var(--r-full);padding:2px 10px}
.pr{font:700 13px/20px var(--f-sans);color:var(--teal-deep);background:var(--mint-tint);border-radius:var(--r-full);padding:2px 10px}
.tip{background:var(--lemon);border-radius:var(--r-sm);padding:8px 12px;font-size:16px;line-height:23px}
.ru{font:600 15px/22px var(--f-sans);color:var(--muted);margin:2px 0 0}
details.ruline{margin:-8px 0 12px}
details.ruline summary,details.txt summary{cursor:pointer;font:800 15px/22px var(--f-sans);color:var(--plum);min-height:36px;display:flex;align-items:center}
details.txt{background:var(--chalk);border:2px dashed var(--cloud);border-radius:var(--r-sm);padding:6px 12px;margin:8px 0 14px;font-size:16px;line-height:24px}
details.txt p{margin:6px 0}
.scard.bonus{border-style:dashed;border-color:var(--sunny)}
.scard.bonus .num{background:var(--lemon)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.sum-card{text-align:left;background:#fff;border:4px solid var(--ink);border-radius:var(--r-lg);padding:14px;margin:12px 0}
.sum-h{font:900 17px/22px var(--f-sans);margin:12px 0 6px}
.sum-err{margin:0;padding-left:22px;font-size:15px;line-height:21px}
.sum-err li{margin-bottom:8px}
.sum-err .w{color:var(--coral-deep);font-weight:800} .sum-err .c{color:var(--teal-deep);font-weight:800}
.sum-ok{color:var(--teal-deep);font-weight:800}
.words td{font-size:16px;line-height:22px;vertical-align:middle}
.say{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-right:8px;border:2px solid var(--cloud);background:#fff;border-radius:50%;font-size:16px;cursor:pointer;vertical-align:middle;flex:none}
.say:active{transform:scale(.92)}
.ipa{font:600 14px/20px var(--f-sans);color:var(--plum)} .rtr{font:700 14px/20px var(--f-sans);color:var(--teal-deep)}
.rule{background:#F4F3FD;border-left:5px solid var(--lilac);border-radius:var(--r-sm);padding:10px 12px;font-size:17px;line-height:26px}
.ex{display:flex;align-items:flex-start;gap:4px;margin:8px 0;font-size:17px;line-height:24px}
.ex u{text-decoration:none;background:var(--lemon);border-radius:4px;padding:0 3px}
.ex .ru{display:inline}
.sess{font:900 16px/22px var(--f-sans);color:var(--plum);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.bx{border-radius:var(--r-md);padding:10px 6px;text-align:center;border:3px solid}
.bx b{display:block;font:900 26px/30px var(--f-poster)} .bx span{display:block;font:800 14px/18px var(--f-sans)} .bx small{display:block;font:600 12px/16px var(--f-sans);color:var(--muted);margin-top:4px}
.bx.t{border-color:var(--mint);background:var(--mint-tint)} .bx.f{border-color:var(--coral);background:var(--coral-tint)} .bx.ns{border-color:var(--sunny);background:var(--lemon)}
.q .say{width:32px;height:32px;font-size:14px;margin-left:4px}
</style>
</head>

<script>
/* =========================================================
   British Bulldog 5–6 · Homework after lesson 3
   Заход 1: грамматика (6) + слова (6). Заход 2: Not stated (8) + категории (3).
   The student doesn't know the rules yet → a rule frame BEFORE each block:
   explanation in Russian, examples with translation and pronunciation (IPA + русская транскрипция + 🔊).
   ========================================================= */
const L = ["A","B","C","D"];
const SAY = en => `<button class="say" type="button" data-say="${en.replace(/"/g,"&quot;")}" aria-label="Послушать">🔊</button>`;
/* word row: English · [IPA] · [по-русски] · перевод */
const W = (en,ipa,rus,ru) => `<tr><td>${SAY(en)}<b>${en}</b><br><span class="ipa">[${ipa}]</span> <span class="rtr">[${rus}]</span></td><td>${ru}</td></tr>`;
const WT = rows => `<table class="words"><tbody>${rows.join("")}</tbody></table>`;
/* example sentence: 🔊 English — перевод */
const EX = (en,ru) => `<p class="ex">${SAY(en.replace(/<[^>]+>/g,""))}<span><b class="en">${en}</b><br><span class="ru">${ru}</span></span></p>`;
const RULE = (t) => `<p class="rule">${t}</p>`;

const PARTS = {
/* ================= ЗАХОД 1 · ЧАСТЬ 1 · ГРАММАТИКА ================= */
g:{ n:"1", icon:"🧩", title:"Грамматика", sub:"Заход 1 · 6 правил", session:1, steps:[
  {th:`<h3>🔎 Как решать грамматику</h3><p>В каждом предложении есть <b>слово-подсказка</b>. Сначала найди его — потом выбирай ответ.</p>`+
    WT([W("Look!","lʊk","лук","Смотри! → это происходит сейчас"),W("yesterday","ˈjestədeɪ","йéстэдэй","вчера → прошлое"),W("isn't / aren't","ˈɪznt / ɑːnt","изнт / аант","нет, не (отрицание)"),W("Sunday","ˈsʌndeɪ","сáндэй","воскресенье → день недели"),W("he / she","hiː / ʃiː","хии / шии","он / она")])+
    `<p class="tip">💡 Перед каждым заданием — правило. Прочитай, нажми 🔊, повтори вслух. Потом — короткая тренировка и задание.</p>`},

  /* 1 · some / any */
  {th:`<h3>some или any?</h3>`+RULE(`<b>some</b> — «несколько, немного» — в <b>утверждении</b> (+).<br><b>any</b> — «никаких, сколько-нибудь» — в <b>отрицании</b> (isn't / aren't) и в <b>вопросе</b> (?).`)+
    WT([W("some","sʌm","сам","несколько, немного"),W("any","ˈeni","э́ни","никаких / какие-нибудь"),W("eggs","eɡz","эгз","яйца"),W("fridge","frɪdʒ","фридж","холодильник")])+
    EX("There are <u>some</u> eggs in the fridge.","В холодильнике есть несколько яиц. (+)")+
    EX("There <u>aren't any</u> eggs in the fridge.","В холодильнике нет яиц. (−)")+
    EX("Are there <u>any</u> eggs?","Есть ли яйца? (?)")+
    `<p class="tip">💡 Увидел <b>n't</b> (isn't, aren't) → ставь <b>any</b>.</p>`},
  {q:"There aren't ___ apples on the table.", o:["any","some","a","much"], a:0, e:"aren't = отрицание → any.", ru:"На столе нет яблок."},
  {test:1, q:"There aren't ___ eggs in the fridge.", o:["some","any","much","a"], a:1, e:"В отрицании (isn't / aren't) → any.", ru:"В холодильнике нет яиц."},

  /* 2 · Present Continuous */
  {th:`<h3>Look! → is + -ing</h3>`+RULE(`<b>Look!</b> (Смотри!), <b>Listen!</b> (Слушай!), <b>now</b> (сейчас) — значит действие идёт <b>прямо сейчас</b>.<br>Формула: <b>am / is / are + глагол-ing</b>.`)+
    WT([W("he / she / it is","iz","из","он / она / оно"),W("they / we / you are","ɑː","аа","они / мы / вы"),W("catch → catching","ˈkætʃɪŋ","кэ́чин","ловить → ловит (сейчас)"),W("ball","bɔːl","бол","мяч")])+
    EX("Look! The cat <u>is sleeping</u>.","Смотри! Кошка спит (сейчас).")+
    EX("Listen! The girls <u>are singing</u>.","Слушай! Девочки поют (сейчас).")+
    `<p class="tip">💡 Одной формы <b>catching</b> мало — нужно <b>is</b> перед ней: <b>is catching</b>.</p>`},
  {q:"Look! The baby ___.", o:["sleeps","is sleeping","sleep","slept"], a:1, e:"Look! = прямо сейчас → is + -ing: is sleeping.", ru:"Смотри! Малыш спит."},
  {test:2, q:"Look! The dog ___ the ball.", o:["catches","catch","is catching","caught"], a:2, e:"Look! = прямо сейчас → is + -ing.", ru:"Смотри! Собака ловит мяч."},

  /* 3 · There is / are */
  {th:`<h3>There is или There are?</h3>`+RULE(`<b>There is</b> — есть <b>один</b> предмет.<br><b>There are</b> — есть <b>много</b> (2, 3, some…).<br>Подсказка — слово после пропуска: <b>a cat</b> → is, <b>two cats</b> → are.`)+
    WT([W("There is","ðeər ɪz","зэа из","есть, находится (один)"),W("There are","ðeər ɑː","зэа аа","есть, находятся (много)"),W("garden","ˈɡɑːdn","гáадн","сад")])+
    EX("<u>There is</u> a cat in the garden.","В саду (есть) кошка.")+
    EX("<u>There are</u> three cats in the garden.","В саду три кошки.")+
    `<p class="tip">💡 <b>th</b> — кончик языка между зубами: <b>th</b>ere. Не «зэр» и не «дэр» — мягкий звук [ð].</p>`},
  {q:"___ a book on my desk.", o:["There are","There is","They are","It are"], a:1, e:"a book (одна) → There is.", ru:"На моей парте (лежит) книга."},
  {test:3, q:"___ two cats in our garden.", o:["There is","There are","It is","They are"], a:1, e:"Две кошки (много) → There are.", ru:"В нашем саду две кошки."},

    <text x="${c-46}" y="${c+56}" text-anchor="middle" font-size="17" font-weight="900" fill="#B8442F" font-family="Nunito,sans-serif">to</text>`; }
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, big=i%5===0, r1=big?R-12:R-6, r2=R-3;
    s+=`<line x1="${(c+r1*Math.sin(a)).toFixed(1)}" y1="${(c-r1*Math.cos(a)).toFixed(1)}" x2="${(c+r2*Math.sin(a)).toFixed(1)}" y2="${(c-r2*Math.cos(a)).toFixed(1)}" stroke="#3B2A1F" stroke-width="${big?3:1.2}" stroke-linecap="round"/>`; }
  for(let n=1;n<=12;n++){ const a=n*30*Math.PI/180, r=R-27;
    s+=`<text x="${(c+r*Math.sin(a)).toFixed(1)}" y="${(c-r*Math.cos(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#3B2A1F" font-family="Nunito,sans-serif">${n}</text>`; }
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  s+=`<line x1="${c}" y1="${c}" x2="${(c+52*Math.sin(ha)).toFixed(1)}" y2="${(c-52*Math.cos(ha)).toFixed(1)}" stroke="#3B2A1F" stroke-width="9" stroke-linecap="round"/>`;
  s+=`<line x1="${c}" y1="${c}" x2="${(c+82*Math.sin(ma)).toFixed(1)}" y2="${(c-82*Math.cos(ma)).toFixed(1)}" stroke="#F4776A" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<circle cx="${c}" cy="${c}" r="7" fill="#F4776A"/></svg>`;
  return s;
}
const qCount=k=>PARTS[k].steps.filter(s=>s.q).length;
const testNums=k=>PARTS[k].steps.filter(s=>s.test).map(s=>s.test);

/* ---------------- HOME ---------------- */
function home(){
  stopSpeech();
  const doneMain=MAIN_KEYS.filter(k=>ST.prog[k]).length;
  let h=`<h1 style="text-align:center">Домашка после урока 3</h1>
   <p class="tagline" style="text-align:center">Собери монетки и открой сундук!</p>
   <p class="lead">Два захода по 10–12 минут. <b>Заход 1</b> (части 1–2) — завтра, <b>заход 2</b> (части 3–4) — через 2–3 дня. Перед заданиями — рамка с правилом: прочитай, нажми 🔊 и повтори вслух. Монетка — за ответ с первой попытки, ошибка вернётся в конце части.</p>`;
  ALL_KEYS.forEach((k,ix)=>{ const P=PARTS[k], r=ST.prog[k];
    if(ix===0||PARTS[ALL_KEYS[ix-1]].session!==P.session) h+=`<p class="sess">${P.session===1?"📅 Заход 1 · завтра":"📅 Заход 2 · через 2–3 дня"}</p>`;
    h+=`<section class="card scard${P.bonus?" bonus":""}"><span class="num">${P.n}</span><div><h2>${P.icon} ${esc(P.title)}</h2>
      <p class="status">${esc(P.sub)} · ${qCount(k)} заданий</p>
      ${r?`<p class="status"><b>✓ Сделано: ${r.got}/${r.total} с первой попытки · 🪙 ${r.got}</b></p>`:`<p class="status">🪙 до ${qCount(k)} монеток</p>`}</div>
      <button class="btn${r?" sec":""}" type="button" data-k="${k}">${r?"Пройти ещё раз":"Начать ▶"}</button></section>`; });
  h+=`<section class="card final"><svg class="chest big-chest" id="homeChest" viewBox="0 0 120 100" role="img" aria-label="Сундук"></svg>
     <p class="status">${doneMain<4?`Сделай все 4 части — откроется сундук и сводка для учителя (${doneMain}/4).`:"Все части сделаны! Открывай сундук 🗝️"}</p>
     <button class="btn" type="button" id="toChest" ${doneMain<4?"disabled":""}>🗝️ ${ST.opened?"Сундук и сводка":"Открыть сундук"}</button></section>`;
  app.innerHTML=h; chestSVG(document.getElementById("homeChest")); if(ST.opened) setOpen(document.getElementById("homeChest"));
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>startPart(b.dataset.k));
  document.getElementById("toChest").onclick=chest;
  toTop();
}

/* ---------------- PART RUN ---------------- */
let RUN=null;
function startPart(k){
  const P=PARTS[k];
  RUN={k, queue:P.steps.map((s,i)=>({i,repeat:false})), first:0, total:qCount(k), done:0, requeued:new Set(), mist:[]};
  step();
}
function head(){ return `<div class="top"><button class="back" type="button" id="toHome">← На главную</button><span>${PARTS[RUN.k].icon} ${esc(PARTS[RUN.k].title)}</span></div>`; }
function bindHead(){ document.getElementById("toHome").onclick=()=>{ if(confirm("Выйти на главную? Эту часть нужно будет начать заново.")) home(); }; }
function textBox(kind){
  if(kind==="listen") return `<div class="row" style="justify-content:flex-start"><button class="btn sec" type="button" id="play">🔊 Слушать запись</button></div>
    <details class="txt"><summary>📄 Показать текст (если совсем трудно)</summary>${LISTEN_TEXT.map((l,i)=>`<p>${esc(l)}<br><span class="ru">${esc(LISTEN_RU[i]||"")}</span></p>`).join("")}</details>`;
  if(kind==="read") return `<details class="txt" ${RUN.k==="bonus"&&PARTS.bonus.steps[RUN.queue[0].i].th?"open":""}><summary>📖 The London Eye — текст</summary>${READ_TEXT.map((l,i)=>`<p>${esc(l)}</p><details class="ruline"><summary>🇷🇺 перевод</summary><p class="ru">${esc(READ_RU[i]||"")}</p></details>`).join("")}</details>`;
  return "";
}
function txtBox(n,open){ const T=TEXTS[n]; return `<details class="txt" ${open?"open":""}><summary>📖 Текст: ${esc(T.title)}</summary><p>${SAY(T.en.join(" "))} <b>весь текст</b></p>${T.en.map((l,i)=>`<p>${SAY(l)}${esc(l)}</p><details class="ruline"><summary>🇷🇺 перевод</summary><p class="ru">${esc(T.ru[i]||"")}</p></details>`).join("")}</details>`; }
function bindText(){ const p=document.getElementById("play"); if(p) p.onclick=()=>playText(p); }
function step(){
  const P=PARTS[RUN.k], it=RUN.queue[0], s=P.steps[it.i];
  const qDone=RUN.done, qAll=RUN.total+RUN.requeued.size;
  const bar=`<div class="pbar" aria-hidden="true"><i style="width:${Math.round(qDone/qAll*100)}%"></i></div>`;
  if(s.th){
    app.innerHTML=head()+bar+`<section class="card theory"><span class="thtag">📘 Правило</span>${s.th}
      ${s.clock?`<div class="clockbox">${clockSVG(s.clock.h,s.clock.m,s.clock.shade)}</div>`:""}${s.after||""}
      ${s.listen?textBox("listen"):""}${s.read?textBox("read"):""}${s.txt!=null?txtBox(s.txt,true):""}
      <div class="row"><button class="btn" type="button" id="next">Понятно ▶</button></div></section>`;
    bindHead(); bindText(); document.getElementById("next").onclick=()=>{ stopSpeech(); RUN.queue.shift(); step(); }; toTop(); return;
  }
  app.innerHTML=head()+bar+`<section class="card">
      <div class="top" style="margin:0 0 8px"><span>${qDone+1} / ${qAll}</span>${s.test?`<span class="testtag">Задание ${s.test}</span>`:`<span class="pr">отработка</span>`}</div>
      ${it.repeat?'<span class="tag">повтор ошибки</span>':""}
      ${s.listen?textBox("listen"):""}${s.read?textBox("read"):""}${s.txt!=null?txtBox(s.txt,true):""}
      ${s.clock?`<div class="clockbox">${clockSVG(s.clock.h,s.clock.m)}</div>`:""}
      <p class="q">${gapify(s.q)} ${SAY(s.q.replace(/___/g,"…"))}</p>
      ${s.ru?`<details class="ruline"><summary>🇷🇺 перевод</summary><p class="ru">${esc(s.ru)}</p></details>`:""}
      <div class="opts">${s.o.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><b>${L[i]}</b>${esc(t)}</button>`).join("")}</div>
      <div id="fb"></div></section>`;
  bindHead(); bindText();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  toTop();
}
function answer(i){
  const P=PARTS[RUN.k], it=RUN.queue[0], s=P.steps[it.i], ok=i===s.a, btns=app.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true); btns[s.a].classList.add("ok");
  if(!ok){ btns[i].classList.add("bad"); if(!reduce) btns[i].classList.add("shake"); }
  chime(ok?"ok":"bad");
  if(!it.repeat){
    if(ok){ RUN.first++; flyCoin(btns[i]); }
    else { RUN.mist.push({test:s.test||0, q:s.q, chose:s.o[i], right:s.o[s.a], clock:s.clock?`часы ${s.clock.h}:${String(s.clock.m).padStart(2,"0")}`:""});
      if(!RUN.requeued.has(it.i)){ RUN.requeued.add(it.i); RUN.queue.push({i:it.i,repeat:true}); } }
  }
  const full=s.q.includes("___")?s.q.replace("___",s.o[s.a].replace(/^[A-Z]+ — .*/,"")):s.q;
  document.getElementById("fb").innerHTML=`<div class="fb"><div class="h ${ok?"ok":"bad"}">${ok?(it.repeat?"Верно! Теперь запомнил 👍":"Верно! +🪙"):"Almost! 💪 Правильно: "+L[s.a]+")"}</div>
    <p>${esc(s.e)}</p><p class="ex">${SAY(full)}<span><b class="en">${esc(full)}</b></span></p><button class="btn" type="button" id="next">Дальше ▶</button></div>`;
  const nx=document.getElementById("next"); nx.onclick=next; nx.focus({preventScroll:true});
  document.getElementById("fb").scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
}
function next(){
  stopSpeech(); RUN.queue.shift(); RUN.done++;
  if(RUN.queue.length){ step(); return; }
  ST.prog[RUN.k]={got:RUN.first,total:RUN.total}; ST.mist[RUN.k]=RUN.mist; save();
  partDone();
}
function partDone(){
  const P=PARTS[RUN.k], r=ST.prog[RUN.k], pct=r.got/r.total*100;
  const cheer=pct>=80?"Отлично, так держать!":pct>=50?"Хорошо! Ошибки ты уже повторил 👍":"Главное — часть сделана! 💪";
  const nextK=ALL_KEYS.find(k=>!ST.prog[k]);
  chime("badge");
  app.innerHTML=`<section class="card final"><span class="emo" style="font-size:52px">${P.icon}</span><h2>${esc(P.title)} — готово!</h2>
    <div class="score">🪙 ${r.got} / ${r.total}</div><p class="note">верно с первой попытки</p><p class="cheer">${cheer}</p>
    <div class="row">${nextK?`<button class="btn" type="button" id="goNext">Дальше: ${esc(PARTS[nextK].title)} ▶</button>`:""}<button class="btn sec" type="button" id="goHome">На главную</button></div></section>`;
  if(nextK) document.getElementById("goNext").onclick=()=>startPart(nextK);
  document.getElementById("goHome").onclick=home; toTop();
}

/* ---------------- CHEST + SUMMARY ---------------- */
function chest(){
  stopSpeech();
  app.innerHTML=`<div class="top"><button class="back" type="button" id="goHome2">← На главную</button><span>🧰 Сундук</span></div>
   <section class="card final"><div class="chestwrap" id="cw"><svg class="chest big-chest" id="bigChest" viewBox="0 0 120 100" role="img" aria-label="Сундук"></svg></div>
   <div class="row" id="openRow"><button class="btn" type="button" id="openChest">🗝️ Открыть сундук</button></div>
   <div id="after" hidden></div></section>`;
  document.getElementById("goHome2").onclick=home;
  const big=document.getElementById("bigChest"); chestSVG(big);
  const open=(anim)=>{ setOpen(big); setOpen(mini); ST.opened=true; save(); document.getElementById("openRow").hidden=true; renderSummary();
    if(anim){ chime("badge"); if(!reduce){ const cw=document.getElementById("cw"); ["🪙","⭐","🪙","🗝️","🪙","✨","🪙","⏰"].forEach((e,i,arr)=>{ const a=i/arr.length*Math.PI*2, b=document.createElement("span"); b.className="burst"; b.textContent=e; b.style.setProperty("--dx",Math.round(Math.cos(a)*110)+"px"); b.style.setProperty("--dy",Math.round(Math.sin(a)*70)+"px"); cw.appendChild(b); b.addEventListener("animationend",()=>b.remove()); }); } } };
  document.getElementById("openChest").onclick=()=>open(true);
  if(ST.opened) open(false);
  toTop();
}
function renderSummary(){
  const d=new Date(), pad=x=>String(x).padStart(2,"0"), when=`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  let got=0,total=0; MAIN_KEYS.forEach(k=>{ if(ST.prog[k]){ got+=ST.prog[k].got; total+=ST.prog[k].total; } });
  const rows=ALL_KEYS.filter(k=>ST.prog[k]).map(k=>`<tr><td>${PARTS[k].icon} ${esc(PARTS[k].title)}</td><td>${ST.prog[k].got}/${ST.prog[k].total}</td><td>${(ST.mist[k]||[]).length||"—"}</td></tr>`).join("");
  const mist=ALL_KEYS.flatMap(k=>(ST.mist[k]||[]).map(m=>Object.assign({k},m)));
  const mlist=mist.length?`<ol class="sum-err">${mist.map(m=>`<li>${m.test?`<b>№${m.test}</b> · `:""}${esc(PARTS[m.k].title)}: ${esc(m.clock?m.clock+" — ":"")}${gapify(m.q)}<br><span class="w">✗ ${esc(m.chose)}</span> <span class="c">✓ ${esc(m.right)}</span></li>`).join("")}</ol>`:`<p class="sum-ok">Ошибок нет! 🎉</p>`;
  const line=[`British Bulldog · ДЗ после урока 3 · ${when}`].concat(ALL_KEYS.filter(k=>ST.prog[k]).map(k=>`${PARTS[k].title}: ${ST.prog[k].got}/${ST.prog[k].total}`)).concat([`Все части: ${got}/${total} · монетки: ${ST.coins}`,"Ошибки:"]).concat(mist.length?mist.map(m=>`- ${m.test?"№"+m.test+" ":""}${PARTS[m.k].title}: ${m.clock?m.clock+" — ":""}${m.q} — выбрал: ${m.chose}; верно: ${m.right}`):["- нет"]).join("\n");
  const A=document.getElementById("after"); A.hidden=false;
  A.innerHTML=`<div class="prize"><span class="emo" style="font-size:34px">🏆</span><br>Bulldog Ready!<br><small style="font-weight:700">ДЗ после урока 3 сделано: грамматика, слова, Not stated, категории.</small></div>
    <div class="sum-card"><p class="sum-h">📋 Сводка для учителя · ${when}</p>
      <div class="score">🪙 ${got} / ${total}</div><p class="note">все части, верно с первой попытки</p>
      <table><thead><tr><th>Часть</th><th>✓ 1-я попытка</th><th>✗</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="sum-h">❌ Ошибки (${mist.length})</p>${mlist}
      <p class="shot">📸 Сделай скриншот сводки и отправь учителю</p></div>
    <textarea class="copyline" id="line" rows="5" readonly>${esc(line)}</textarea>
    <div class="row"><button class="btn sec" type="button" id="copy">📋 Скопировать текстом</button><span class="note" id="copied"></span></div>`;
  document.getElementById("copy").onclick=()=>{ const ta=document.getElementById("line"), msg=document.getElementById("copied"); const ok=()=>msg.textContent="Скопировано ✓";
    const fb=()=>{ ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ msg.textContent="Выдели текст и скопируй вручную"; } };
    try{ if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(line).then(ok,fb); else fb(); }catch(e){ fb(); } };
}

/* teacher: 3 quick taps on the logo → unlock all parts (for checking) */
(function(){ let taps=[]; document.getElementById("logo").addEventListener("click",()=>{ const now=Date.now(); taps=taps.filter(x=>now-x<1500); taps.push(now);
  if(taps.length>=3){ taps=[]; if(confirm("Учитель: отметить все части как сделанные (для проверки сундука)?")){ MAIN_KEYS.forEach(k=>{ if(!ST.prog[k]) ST.prog[k]={got:0,total:qCount(k)}; }); save(); home(); } } }); })();

document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-say]"); if(!b) return; ev.preventDefault(); stopSpeech(); speak(b.dataset.say); });
/* self-check */
(function(){ const bad=[], pos=[]; ALL_KEYS.forEach(k=>PARTS[k].steps.forEach((s,i)=>{ if(s.q){ if(!(s.a>=0&&s.a<s.o.length)) bad.push(k+":"+i); if(new Set(s.o).size!==s.o.length) bad.push("dup "+k+":"+i); if(k!=="ns") pos.push(s.a); } }));
  console.log(bad.length?"CHECK FAILED "+bad.join(" | "):"Homework check OK: "+ALL_KEYS.map(k=>k+" "+qCount(k)).join(", ")+" · positions "+pos.join("")); })();
home();

</script>
